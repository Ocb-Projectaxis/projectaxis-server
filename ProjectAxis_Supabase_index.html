<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ProjectAxis</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:        #060914;
  --bg2:       #090d1c;
  --glass:     rgba(255,255,255,0.032);
  --glass2:    rgba(255,255,255,0.058);
  --glass3:    rgba(255,255,255,0.085);
  --border:    rgba(255,255,255,0.065);
  --border2:   rgba(255,255,255,0.13);
  --blue:      #4f8ef7;
  --blue2:     #7ab3ff;
  --indigo:    #7c7cf5;
  --green:     #0fba81;
  --green2:    #2ee8a5;
  --amber:     #f6a623;
  --red:       #f5395a;
  --purple:    #b49dfa;
  --cyan:      #22d3ee;
  --teal:      #14b8a6;
  --text:      #dde4f0;
  --sub:       #5e708a;
  --muted:     #232e45;
  --font:      'Outfit', sans-serif;
  --mono:      'DM Mono', monospace;
  --r:         10px;
  --r2:        14px;
  --r3:        18px;
}

html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden}

/* MESH BACKGROUND — richer layered aurora */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 55% at 5% -5%,    rgba(79,142,247,.12) 0%, transparent 55%),
    radial-gradient(ellipse 55% 45% at 95% 105%,  rgba(124,124,245,.10) 0%, transparent 50%),
    radial-gradient(ellipse 45% 65% at 50% 40%,   rgba(20,184,166,.05)  0%, transparent 65%),
    radial-gradient(ellipse 80% 30% at 20% 100%,  rgba(34,211,238,.04)  0%, transparent 60%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 39px,rgba(255,255,255,.012) 40px),
             repeating-linear-gradient(90deg,transparent,transparent 39px,rgba(255,255,255,.012) 40px);
}

/* LOADER — transparent, logo only */
#loader{
  position:fixed;inset:0;z-index:999;background:transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
}
#loader-logo{
  width:220px;height:220px;object-fit:contain;
  animation:logo-float 3s ease-in-out infinite;
  filter:drop-shadow(0 0 48px rgba(99,102,241,.65)) drop-shadow(0 8px 32px rgba(0,0,0,.55));
}
@keyframes logo-float{
  0%,100%{transform:translateY(0px);}
  50%{transform:translateY(-12px);}
}
.loader-name{font-size:19px;font-weight:700;letter-spacing:-.2px;color:rgba(255,255,255,.9)}
#loader-msg{font-size:12px;color:var(--sub);letter-spacing:.4px}
.spin{width:22px;height:22px;border:2px solid rgba(255,255,255,.08);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* LAYOUT */
#app{display:flex;height:100vh;position:relative;z-index:1;display:none}

/* SIDEBAR */
#sidebar{
  width:234px;flex-shrink:0;
  background:linear-gradient(180deg,rgba(9,13,28,.97) 0%,rgba(6,9,20,.99) 100%);
  border-right:1px solid rgba(255,255,255,.055);
  display:flex;flex-direction:column;
  padding:20px 12px 16px;
  overflow-y:auto;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
}

/* BRAND */
.brand{display:flex;align-items:center;gap:10px;padding-bottom:18px;margin-bottom:4px;border-bottom:1px solid var(--border)}
.brand-logo{width:38px;height:38px;border-radius:10px;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.15);padding:3px}
.brand-logo img{width:32px;height:32px;object-fit:contain}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-.2px}
.brand-ver{font-size:10px;color:var(--sub);font-family:var(--mono);margin-top:1px}
/* OCB Inline SVG logo */
.ocb-logo-lg{width:60px;height:60px;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}

/* NAV */
.slabel{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase;padding:14px 8px 5px}
.nav{display:flex;flex-direction:column;gap:2px}
.nb{
  display:flex;align-items:center;gap:10px;
  padding:9px 11px;border-radius:10px;border:none;cursor:pointer;
  font-family:var(--font);font-size:13px;font-weight:500;width:100%;text-align:left;
  background:transparent;color:var(--sub);transition:all .18s;
  position:relative;
}
.nb:hover{color:var(--text);background:var(--glass2)}
.nb.on{
  color:#fff;font-weight:600;
  background:linear-gradient(135deg,rgba(79,142,247,.18),rgba(124,124,245,.12));
  border:1px solid rgba(79,142,247,.2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
}
.nb.on::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:2.5px;border-radius:99px;background:linear-gradient(180deg,var(--blue),var(--indigo))}
.nb-ico{font-size:15px;width:22px;text-align:center;opacity:.8}

/* COHORT QUICK LIST */
.cq{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:9px;cursor:pointer;transition:background .15s;margin-bottom:1px}
.cq:hover{background:var(--glass)}
.cq-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cq-name{flex:1;font-size:11px;font-weight:500;color:var(--sub);line-height:1.35;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cq-pct{font-size:10px;font-weight:700;font-family:var(--mono)}

/* GLOBAL BAR */
.gbar{margin-top:auto;padding:12px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(10px)}
.gbar-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.8px;margin-bottom:6px}
.bar{height:4px;border-radius:99px;background:var(--muted);overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.bar.md{height:6px}.bar.lg{height:9px}
#gbar-pct{font-size:11px;font-weight:500;color:var(--sub);margin-top:5px;font-family:var(--mono)}

/* MAIN */
#main{flex:1;overflow-y:auto;padding:28px 32px;scroll-behavior:smooth}

/* TABS */
.tab{display:none}.tab.on{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* PAGE HEADER */
.ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:26px;flex-wrap:wrap;gap:12px}
.ph-left{}
.ph-title{font-size:23px;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg,#dde4f0 30%,#7ea8e0 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.ph-sub{font-size:12px;color:var(--sub);margin-top:4px;font-weight:400}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* GLASS CARD */
.gc{
  background:linear-gradient(145deg,rgba(255,255,255,.038),rgba(255,255,255,.018));
  border:1px solid var(--border);
  border-radius:var(--r3);
  padding:20px;
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  transition:border-color .2s,box-shadow .2s;
  box-shadow:0 2px 16px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.05);
}
.gc.sm{padding:14px 16px}
.gc.click{cursor:pointer}
.gc.click:hover{border-color:var(--border2);box-shadow:0 10px 36px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.07)}

/* STAT CARDS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:12px;margin-bottom:24px}
.sc{
  background:linear-gradient(145deg,rgba(255,255,255,.04),rgba(255,255,255,.015));
  border:1px solid var(--border);
  border-radius:var(--r3);padding:18px 20px;
  position:relative;overflow:hidden;
  transition:transform .2s,border-color .2s,box-shadow .2s;
  box-shadow:0 2px 12px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.05);
}
.sc:hover{transform:translateY(-3px);border-color:var(--border2);box-shadow:0 12px 32px rgba(0,0,0,.28)}
.sc::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
.sc-glow{position:absolute;top:-24px;right:-24px;width:90px;height:90px;border-radius:50%;filter:blur(32px);opacity:.35}
.sc-val{font-size:32px;font-weight:800;line-height:1;letter-spacing:-.8px;font-family:var(--mono);position:relative;z-index:1}
.sc-label{font-size:11px;font-weight:600;margin-top:6px;position:relative;z-index:1;letter-spacing:.3px;color:var(--sub)}
.sc-sub{font-size:10px;color:var(--muted);margin-top:2px;position:relative;z-index:1}

/* COHORT CARDS */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.cc{
  background:linear-gradient(145deg,rgba(255,255,255,.04),rgba(255,255,255,.015));
  border:1px solid var(--border);
  border-radius:var(--r3);padding:18px;cursor:pointer;
  transition:border-color .2s,box-shadow .2s,transform .2s;
  position:relative;overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,.2);
}
.cc:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 14px 44px rgba(0,0,0,.32)}
.cc-top{position:absolute;top:0;left:0;right:0;height:2px;opacity:.8}
.cc-glow{position:absolute;top:-50px;right:-30px;width:130px;height:130px;border-radius:50%;filter:blur(55px);opacity:.12}

/* COMPARE CARDS */
.ccmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:24px}
.ccard{
  background:linear-gradient(145deg,rgba(255,255,255,.04),rgba(255,255,255,.015));
  border:1px solid var(--border);
  border-radius:var(--r3);padding:16px;cursor:pointer;
  transition:border-color .2s,transform .15s,box-shadow .2s;
  border-top:2px solid;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.ccard:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.28)}

/* TABLE */
.tw{background:linear-gradient(145deg,rgba(255,255,255,.03),rgba(255,255,255,.01));border:1px solid var(--border);border-radius:var(--r3);overflow:hidden;backdrop-filter:blur(10px)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:11px 14px;font-size:10px;color:var(--sub);font-weight:700;letter-spacing:.9px;text-transform:uppercase;border-bottom:1px solid var(--border);background:rgba(0,0,0,.22)}
td{padding:12px 14px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr{transition:background .12s}
tbody tr:hover td{background:rgba(255,255,255,.03);cursor:pointer}
.sub{font-size:11px;color:var(--sub);margin-top:1px}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:10px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.bg{background:rgba(15,186,129,.1);color:#2ee8a5;border:1px solid rgba(15,186,129,.22)}
.ba{background:rgba(246,166,35,.1);color:#fbbf24;border:1px solid rgba(246,166,35,.22)}
.br{background:rgba(245,57,90,.1);color:#ff7490;border:1px solid rgba(245,57,90,.22)}
.bp{background:rgba(180,157,250,.1);color:#c4b5fd;border:1px solid rgba(180,157,250,.22)}
.bc{background:rgba(34,211,238,.1);color:#67e8f9;border:1px solid rgba(34,211,238,.22)}
.bx{background:var(--glass);color:var(--sub);border:1px solid var(--border)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:10px;font-size:13px;font-weight:600;border:none;cursor:pointer;font-family:var(--font);transition:all .15s;white-space:nowrap;letter-spacing:-.1px}
.btn.prim{
  background:linear-gradient(135deg,#4f8ef7,#7c7cf5);
  color:#fff;
  box-shadow:0 4px 16px rgba(79,142,247,.3),inset 0 1px 0 rgba(255,255,255,.15);
}
.btn.prim:hover{box-shadow:0 6px 24px rgba(79,142,247,.45),inset 0 1px 0 rgba(255,255,255,.2);transform:translateY(-1px)}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--sub);border:1px solid rgba(255,255,255,.08)}
.btn.ghost:hover{background:rgba(255,255,255,.09);color:var(--text);border-color:rgba(255,255,255,.15)}
.btn.danger{background:rgba(245,57,90,.08);color:#ff7490;border:1px solid rgba(245,57,90,.2)}
.btn.danger:hover{background:rgba(245,57,90,.16);border-color:rgba(245,57,90,.35)}
.btn.success{background:rgba(15,186,129,.09);color:#2ee8a5;border:1px solid rgba(15,186,129,.22)}
.btn.success:hover{background:rgba(15,186,129,.18);border-color:rgba(15,186,129,.4)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn.xs{padding:3px 9px;font-size:11px;border-radius:7px}

/* FORMS */
.inp,.sel,.ta{
  width:100%;
  background:rgba(0,0,0,.28);
  color:var(--text);
  border:1px solid rgba(255,255,255,.09);
  border-radius:10px;
  padding:9px 12px;font-size:13px;font-family:var(--font);
  outline:none;transition:border-color .15s,box-shadow .15s,background .15s;
}
.inp:focus,.sel:focus,.ta:focus{
  border-color:rgba(79,142,247,.6);
  box-shadow:0 0 0 3px rgba(79,142,247,.12);
  background:rgba(0,0,0,.38);
}
.inp::placeholder{color:var(--sub)}
.ta{resize:vertical;min-height:80px;line-height:1.6}
.sel option{background:#0e1420}
.lbl{font-size:10px;font-weight:700;color:var(--sub);margin-bottom:5px;display:block;letter-spacing:.7px;text-transform:uppercase}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fhint{font-size:10px;color:var(--muted);margin-top:3px}

/* RING */
.ring{position:relative;display:inline-flex;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--mono)}

/* MILESTONE BARS */
.msbar-row{margin-bottom:10px}
.msbar-top{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;align-items:center}
.msbar-bg{height:20px;background:rgba(0,0,0,.3);border-radius:6px;overflow:hidden;border:1px solid var(--border);position:relative;display:flex;align-items:center}
.msbar-fill{height:100%;border-radius:5px;transition:width .6s ease;position:relative}
.msbar-fill::after{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:rgba(255,255,255,.08);border-radius:5px 5px 0 0}

/* MILESTONE CHECKBOXES */
.msck{display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:9px;margin-bottom:4px;border:1px solid;transition:all .15s}
.msck.done{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.2)}
.msck.pend{background:rgba(0,0,0,.2);border-color:var(--border)}
.msck input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--green);flex-shrink:0}

/* SECTION TITLE */
.st{font-size:12px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--sub);letter-spacing:.6px;text-transform:uppercase}
.st::after{content:'';flex:1;height:1px;background:var(--border)}

/* INFO CELLS */
.ic{background:rgba(0,0,0,.25);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px}
.ic-k{font-size:9px;font-weight:700;color:var(--sub);letter-spacing:.7px;text-transform:uppercase;margin-bottom:4px}
.ic-v{font-size:13px;font-weight:600}

/* LOG */
.li{display:flex;gap:11px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:2px}
.li:last-child{border-bottom:none;padding-bottom:0}
.li-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:1px}

/* MODAL */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:100;display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.mo.open{display:flex}
.mb{
  background:linear-gradient(150deg,rgba(11,15,28,.99),rgba(7,10,20,.99));
  border:1px solid rgba(255,255,255,.1);border-radius:20px;
  width:100%;max-width:580px;max-height:90vh;overflow-y:auto;
  animation:fadein .2s ease;
  box-shadow:0 28px 72px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.06);
}
.mb.lg{max-width:720px}
.mh{padding:22px 24px 0;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:16px}
.mh h3{font-size:16px;font-weight:700;letter-spacing:-.2px}
.mbody{padding:0 24px 24px}

/* TOAST NOTIFICATION SYSTEM */
#toast-container{position:fixed;top:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast-item{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px;border-radius:12px;
  font-size:13px;font-weight:500;
  backdrop-filter:blur(20px);
  box-shadow:0 8px 32px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.06);
  pointer-events:all;min-width:260px;max-width:360px;
  animation:toast-in .25s cubic-bezier(.34,1.56,.64,1);
  transition:opacity .3s,transform .3s;
}
.toast-item.out{opacity:0;transform:translateX(20px)}
@keyframes toast-in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
.toast-item.info{background:rgba(14,20,40,.95);border:1px solid rgba(59,130,246,.3)}
.toast-item.success{background:rgba(10,30,22,.95);border:1px solid rgba(16,185,129,.3)}
.toast-item.error{background:rgba(30,10,14,.95);border:1px solid rgba(244,63,94,.3)}
.toast-item.warn{background:rgba(30,24,10,.95);border:1px solid rgba(245,158,11,.3)}
.toast-item.loading{background:rgba(14,20,40,.95);border:1px solid rgba(99,102,241,.3)}
.toast-icon{font-size:16px;flex-shrink:0}
.toast-text{flex:1;line-height:1.4}
.toast-close{background:none;border:none;color:rgba(255,255,255,.3);cursor:pointer;font-size:14px;padding:0 0 0 4px;flex-shrink:0;transition:color .15s}
.toast-close:hover{color:rgba(255,255,255,.7)}

/* CONFIRM DIALOG */
#confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
#confirm-overlay.open{display:flex}
#confirm-box{
  background:linear-gradient(135deg,rgba(14,17,28,.99),rgba(8,12,20,.99));
  border:1px solid rgba(255,255,255,.12);border-radius:16px;
  padding:28px;max-width:380px;width:100%;
  box-shadow:0 24px 64px rgba(0,0,0,.7);
  animation:fadein .2s ease;text-align:center;
}
#confirm-icon{font-size:36px;margin-bottom:12px}
#confirm-title{font-size:16px;font-weight:700;margin-bottom:6px}
#confirm-msg{font-size:13px;color:var(--sub);margin-bottom:22px;line-height:1.55}
#confirm-actions{display:flex;gap:10px;justify-content:center}

/* SETTINGS */
.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.settings-section{background:var(--glass);border:1px solid var(--border);border-radius:var(--r2);padding:18px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.settings-row:last-child{border-bottom:none}
.settings-row-info{flex:1}
.settings-row-name{font-size:13px;font-weight:600}
.settings-row-sub{font-size:11px;color:var(--sub);margin-top:1px}
.settings-row-actions{display:flex;gap:6px;flex-shrink:0;margin-left:12px}

/* CSV */
.csv-ta{font-family:var(--mono);font-size:11px;background:rgba(0,0,0,.4);border:1px solid var(--border2);color:var(--text);border-radius:9px;padding:10px;width:100%;min-height:120px;outline:none;resize:vertical;line-height:1.7}
.csv-ta:focus{border-color:var(--blue)}

/* DEADLINE ALERT ROWS */
.dl-row{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.dl-row:last-child{border-bottom:none}
.dl-row:hover{background:var(--glass)}

/* UTILS */
.flex{display:flex}.fb{display:flex;justify-content:space-between;align-items:center}
.fwrap{flex-wrap:wrap}
.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.mt4{margin-top:4px}.mt8{margin-top:8px}
.muted{color:var(--sub)}.small{font-size:12px}.xs{font-size:11px}.bold{font-weight:600}
.mono{font-family:var(--mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none!important}

/* SILENT RELOAD PROGRESS BAR */
#progress-bar{
  position:fixed;top:0;left:0;height:2.5px;width:0%;z-index:600;
  background:linear-gradient(90deg,var(--blue),var(--indigo),var(--cyan));
  box-shadow:0 0 10px rgba(79,142,247,.6);
  transition:width .3s ease,opacity .4s ease;
  opacity:0;pointer-events:none;border-radius:0 2px 2px 0;
}
#progress-bar.active{opacity:1}
#progress-bar.done{width:100%!important;opacity:0;transition:width .15s,opacity .5s .15s}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--muted);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
@media(max-width:720px){#sidebar{display:none}#main{padding:14px}.frow,.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="progress-bar"></div>

<!-- LOADER -->

<script>
// ═══ STATE ════════════════════════════════════════════════════════
var D = { cohorts:[], students:[], milestones:[], progress:[], logs:[], sessions:[], supervisors:[], programmes:[], settings:{} };
var COLORS = ['#3b82f6','#10b981','#f59e0b','#a78bfa','#06b6d4','#f43f5e','#f97316','#ec4899'];
var todayMs = new Date().setHours(0,0,0,0); // refreshed each renderAll

// Current logged-in user — persisted in sessionStorage so page refresh keeps login
var ME = null;
function meStr()          { return ME ? ME.fullName : 'Unknown'; }
function meRole()         { return ME ? ME.role : ''; }

// ── 5-Level Authority System ──────────────────────────────────────
// sysadmin       → full system access + user management
// programme_head → cross-cohort view + reports (no edits)
// coordinator    → manage cohorts & students (no user management)
// supervisor     → own students only, can approve milestones
// viewer         → read-only, no exports
function isSysAdmin()       { return meRole() === 'sysadmin'; }
function isProgrammeHead()  { return meRole() === 'programme_head'; }
function isCoordinator()    { return meRole() === 'coordinator'; }
function isSupervisor()     { return meRole() === 'supervisor'; }
function isViewer()         { return meRole() === 'viewer'; }

// Legacy alias — code that previously called isAdmin() now maps to sysadmin OR coordinator
// (coordinators can do most admin tasks except user management)
function isAdmin()          { return isSysAdmin() || isCoordinator(); }

// Can manage users?
function canManageUsers()   { return isSysAdmin(); }
// Can edit cohorts/students/milestones?
function canEdit()          { return isSysAdmin() || isCoordinator(); }
// Can see all cohorts cross-programme (programme_head gets read-only cross-cohort view)
function canViewAll()       { return isSysAdmin() || isProgrammeHead() || isCoordinator(); }
// Can approve milestones?
function canApproveMilestone(x) {
  return isSysAdmin() || isCoordinator() ||
    (isSupervisor() && s(x ? x.SupervisorID : '') === s(mySupervisorId()));
}

function mySupervisorId()   { return ME ? (ME.supervisorId || '') : ''; }
// Returns true if the current user is allowed to see this student
function canSeeStudent(x) {
  if (isSupervisor()) return s(x.SupervisorID) === s(mySupervisorId());
  return true; // all other roles see all students
}

// Role definitions for the 5-level authority system
var ROLES = [
  { value:'sysadmin',       label:'System Admin',    color:'#f59e0b', desc:'Full access + user management' },
  { value:'programme_head', label:'Programme Head',  color:'#a78bfa', desc:'View & report across all cohorts' },
  { value:'coordinator',    label:'Coordinator',     color:'#3b82f6', desc:'Manage cohorts, add students' },
  { value:'supervisor',     label:'Supervisor',      color:'#10b981', desc:'Own students only - approve milestones' },
  { value:'viewer',         label:'Viewer',          color:'#6b7a99', desc:'Read only' }
];

// Role display label & colour for UI
function roleLabel(r) {
  return {
    sysadmin:       { label: 'System Admin',    color: '#f59e0b' },
    programme_head: { label: 'Programme Head',  color: '#a78bfa' },
    coordinator:    { label: 'Coordinator',     color: '#3b82f6' },
    supervisor:     { label: 'Supervisor',      color: '#10b981' },
    viewer:         { label: 'Viewer',          color: '#6b7a99' }
  }[r] || { label: r, color: '#6b7a99' };
}

// ═══ BOOT ═════════════════════════════════════════════════════════
window.onload = function() {
  // Restore session
  try {
    var saved = sessionStorage.getItem('pgtrack_user');
    if (saved) ME = JSON.parse(saved);
  } catch(e) { ME = null; }

  if (ME) {
    bootApp();
  } else {
    showLoginScreen();
  }
};

function showLoginScreen() {
  document.getElementById('loader').style.display = 'none';
  document.getElementById('app').style.display    = 'none';
  var ls = document.getElementById('login-screen');
  ls.style.display = 'flex';
  setTimeout(function(){ document.getElementById('li-user').focus(); }, 100);
}

function submitLogin() {
  var u = document.getElementById('li-user').value.trim();
  var p = document.getElementById('li-pass').value;
  var errEl = document.getElementById('li-err');
  errEl.style.display = 'none';
  if (!u || !p) { errEl.textContent = 'Please enter username and password.'; errEl.style.display='block'; return; }

  var btn = document.querySelector('#login-screen .btn.prim');
  btn.textContent = 'Signing in…'; btn.disabled = true;

  gsr().withSuccessHandler(function(r) {
    btn.textContent = 'Sign In →'; btn.disabled = false;
    if (!r || !r.ok) {
      errEl.textContent = r ? r.error : 'Login failed. Try again.';
      errEl.style.display = 'block';
      document.getElementById('li-pass').value = '';
      return;
    }
    ME = r.user;
    // Store the JWT token so all subsequent API calls are authenticated
    if (r.token) _setToken(r.token);
    try { sessionStorage.setItem('pgtrack_user', JSON.stringify(ME)); } catch(e){}
    document.getElementById('login-screen').style.display = 'none';
    bootApp();
  }).withFailureHandler(function(e) {
    btn.textContent = 'Sign In →'; btn.disabled = false;
    errEl.textContent = 'Connection error: ' + (e ? e.message : 'unknown');
    errEl.style.display = 'block';
  }).loginUser(u, p);
}

function logoutUser() {
  confirm2('⏏','Sign Out','Are you sure you want to sign out?','Sign Out','danger', function(){
    stopAutoPoll();
    ME = null;
    _clearToken();
    try { sessionStorage.removeItem('pgtrack_user'); } catch(e){}
    document.getElementById('app').style.display    = 'none';
    document.getElementById('loader').style.display = 'none';
    document.getElementById('li-pass').value = '';
    document.getElementById('li-err').style.display = 'none';
    showLoginScreen();
  });
}

function bootApp() {
  // Update sidebar
  document.getElementById('user-name').textContent   = ME ? ME.fullName : '—';
  var rl2 = ME ? roleLabel(ME.role) : {label:'—',color:'var(--sub)'};
  document.getElementById('user-role').textContent = rl2.label;
  document.getElementById('user-role').style.color = rl2.color;
  document.getElementById('user-avatar').style.background = rl2.color;
  document.getElementById('user-avatar').textContent = ME ? ME.fullName.charAt(0).toUpperCase() : '?';
  // Admin-only nav items — only sysadmin sees User Management
  document.querySelectorAll('.admin-only').forEach(function(el){
    el.style.display = canManageUsers() ? '' : 'none';
  });

  lmsg('Connecting…');
  document.getElementById('loader').style.display = 'flex';
  var t = setTimeout(function() {
    lerr('Timed out after 30s. Possible causes:<br><br>'
      +'• The Progress sheet has too many rows.<br>'
      +'  <b>Run nukeProgressDuplicates() in Apps Script editor, then retry.</b><br><br>'
      +'• Script not authorised — run <b>init()</b> in the editor and re-deploy.');
  }, 30000);

  gsr().withSuccessHandler(function(r) {
    if (r !== 'WORKS') { clearTimeout(t); lerr('Unexpected ping: ' + r); return; }
    lmsg('Loading data…');

    function onData(d) {
      clearTimeout(t);
      if (!d) { lerr('No data returned. Check Apps Script Executions log.'); return; }
      if (!d.ok) {
        if (isSupervisor() && !mySupervisorId()) {
          lerr('Your account has no Supervisor ID linked.<br><br>'
            +'Ask your admin to open <b>Users tab → edit your account</b> and set the Supervisor field.');
          return;
        }
        lerr('Data load failed: ' + (d.error || JSON.stringify(d)));
        return;
      }
      store(d);
      // Capture initial change token so first poll doesn't trigger a redundant reload
      _lastToken = (d.progress||[]).length + '_' + (d.progress||[]).reduce(function(a,p){return a+Number(p.Done||0);},0) + '';
      // Apply saved poll interval from settings
      if (d.settings && d.settings.pollInterval) {
        POLL_INTERVAL = Math.max(15, parseInt(d.settings.pollInterval, 10)) * 1000;
      }
      document.getElementById('loader').style.display = 'none';
      document.getElementById('app').style.display    = 'flex';
      document.querySelectorAll('.nb').forEach(function(b){
        b.onclick = function(){
          if (b.dataset.tab === 'users' && !canManageUsers()) return;
          goTab(b.dataset.tab);
        };
      });
      renderAll();
      startAutoPoll(); // begin background sync
    }
    function onErr(e) { clearTimeout(t); lerr('Data error: '+(e?e.message:'unknown')+'<br><br>Check Apps Script Executions.'); }

    // Supervisors get a pre-filtered data set — only their own students/cohorts
    if (isSupervisor() && mySupervisorId()) {
      gsr().withSuccessHandler(onData).withFailureHandler(onErr).getDataForSupervisor(mySupervisorId());
    } else {
      gsr().withSuccessHandler(onData).withFailureHandler(onErr).getData();
    }  }).withFailureHandler(function(e){ clearTimeout(t); lerr('Connection error: '+(e?e.message:'unknown')); })
  .ping();
}

function store(d) {
  D.cohorts     = d.cohorts     || [];
  D.students    = d.students    || [];
  D.milestones  = d.milestones  || [];
  D.progress    = normaliseProgress(d.progress || []);
  D.logs        = d.logs        || [];
  D.supervisors = d.supervisors || [];
  D.programmes  = d.programmes  || [];
  D.sessions    = d.sessions    || [];
  D.settings    = d.settings    || {};
}

// Guarantee Progress rows always have the right field names regardless
// of what the backend returns — defensive normalisation by position fallback.
function normaliseProgress(arr) {
  return arr.map(function(p) {
    // If the row already has correct keys, return as-is (fast path)
    if ('StudentID' in p && 'MilestoneID' in p && 'Done' in p) {
      return { StudentID: String(p.StudentID||''), MilestoneID: String(p.MilestoneID||''),
               Done: Number(p.Done||0), Date: p.Date||'', UpdatedBy: p.UpdatedBy||'' };
    }
    // Fallback: try to find by position (values array) or common alias names
    var keys = Object.keys(p);
    return {
      StudentID:   String(p.StudentID || p['Student ID'] || p[keys[0]] || ''),
      MilestoneID: String(p.MilestoneID || p['Milestone ID'] || p[keys[1]] || ''),
      Done:        Number(p.Done || p[keys[2]] || 0),
      Date:        String(p.Date || p[keys[3]] || ''),
      UpdatedBy:   String(p.UpdatedBy || p['Updated By'] || p[keys[4]] || '')
    };
  });
}
function lmsg(t){ document.getElementById('loader-msg').innerHTML = t; }
function lerr(t){
  document.getElementById('loader').innerHTML =
    '<div style="text-align:center;max-width:460px;padding:24px">'
    +'<div style="font-size:40px;margin-bottom:14px">⚠️</div>'
    +'<div style="font-size:18px;font-weight:700;color:#f43f5e;margin-bottom:10px">Could not load</div>'
    +'<div style="font-size:12px;color:#6b7a99;line-height:1.8;margin-bottom:22px">'+t+'</div>'
    +'<button onclick="location.reload()" style="padding:10px 22px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer">🔄 Retry</button>'
    +'</div>';
}
// ── API layer — replaces google.script.run ──────────────────────
// Every gsr().withSuccessHandler(fn).funcName(args) call works unchanged.
// Point API_BASE at your Railway URL after deploying.
var API_BASE = (window.PROJECTAXIS_API_URL || 'projectaxis-server-production.up.railway.app');

// Get stored JWT token
function _getToken() {
  try { return localStorage.getItem('pa_token') || ''; } catch(e){ return ''; }
}
function _setToken(t) {
  try { localStorage.setItem('pa_token', t); } catch(e){}
}
function _clearToken() {
  try { localStorage.removeItem('pa_token'); localStorage.removeItem('pa_user'); } catch(e){}
}

// Map old GAS function names to new REST endpoints + HTTP method + body builder
var _routes = {
  // Auth (no token required)
  loginUser:            { url:'/api/auth/login',                   auth:false, body:function(u,p){ return {username:u,password:p}; } },
  changePassword:       { url:'/api/auth/change-password',         auth:true,  body:function(u,o,n){ return {oldPassword:o,newPassword:n}; } },
  adminResetPassword:   { url:'/api/auth/admin-reset-password',    auth:true,  body:function(id,pw){ return {userId:id,newPassword:pw}; } },
  getUsers:             { url:'/api/auth/users',                   auth:true,  method:'GET' },
  saveUser:             { url:'/api/auth/save-user',               auth:true,  body:function(id,u,pw,role,name,email,active,supId){ return {id,username:u,password:pw,role,fullName:name,email,active,supervisorId:supId}; } },
  deleteUser:           { url:'/api/auth/delete-user',             auth:true,  body:function(id){ return {id}; } },
  // Data reads
  ping:                 { url:'/ping',                              auth:false, method:'GET', transform:function(r){ return r.ok?'WORKS':null; } },
  bootData:             { url:'/api/data/boot',                    auth:true,  method:'GET' },
  getData:              { url:'/api/data/boot',                    auth:true,  method:'GET' },
  getDataForSupervisor: { url:'/api/data/boot-supervisor',         auth:true,  method:'GET' },
  getProgressOnly:      { url:'/api/data/progress-only',          auth:true,  method:'GET' },
  getChangeToken:       { url:'/api/data/change-token',            auth:true,  method:'GET' },
  getUpcomingDeadlines: { url:'/api/data/deadlines',               auth:true,  method:'GET' },
  // Cohort writes
  addCohort:            { url:'/api/write/cohort/add',             auth:true,  body:function(n,sem,prog,unit,st,en,lv){ return {name:n,semester:sem,programme:prog,unit,startDate:st,endDate:en,level:lv}; } },
  updateCohort:         { url:'/api/write/cohort/update',          auth:true,  body:function(id,n,sem,prog,unit,st,en,status,lv){ return {id,name:n,semester:sem,programme:prog,unit,startDate:st,endDate:en,status,level:lv}; } },
  deleteCohort:         { url:'/api/write/cohort/delete',          auth:true,  body:function(id){ return {id}; } },
  // Student writes
  addStudent:           { url:'/api/write/student/add',            auth:true,  body:function(cid,n,reg,em,sup,title,mob,prog,spec){ return {cohortId:cid,name:n,regNo:reg,email:em,supervisorId:sup,title,mobile:mob,programme:prog,specialisation:spec}; } },
  updateStudent:        { url:'/api/write/student/update',         auth:true,  body:function(id,n,reg,em,title,cid,sup,mob,prog,spec){ return {id,name:n,regNo:reg,email:em,title,cohortId:cid,supervisorId:sup,mobile:mob,programme:prog,specialisation:spec}; } },
  updateStudentStatus:  { url:'/api/write/student/update-status',  auth:true,  body:function(id,status,pct){ return {id,status,progressPct:pct}; } },
  bulkAdd:              { url:'/api/write/student/bulk-add',       auth:true,  body:function(cid,rows){ return {cohortId:cid,rows}; } },
  // Milestone writes
  saveMilestones:       { url:'/api/write/milestones/save',        auth:true,  body:function(cid,ms){ return {cohortId:cid,milestones:ms}; } },
  // Progress
  saveTick:             { url:'/api/write/tick',                   auth:true,  body:function(sid,mid,dv,by){ return {studentId:sid,milestoneId:mid,doneVal:dv,updatedBy:by}; } },
  // Logs
  addLog:               { url:'/api/write/log/add',                auth:true,  body:function(sid,cid,note,by,type){ return {studentId:sid,cohortId:cid,note,by,type}; } },
  deleteLog:            { url:'/api/write/log/delete',             auth:true,  body:function(id){ return {id}; } },
  // Sessions

// gsr() returns a proxy that mimics google.script.run chaining
function gsr() {
  var _onSuccess = null;
  var _onFailure = null;
  var proxy = {
    withSuccessHandler: function(fn){ _onSuccess=fn; return proxy; },
    withFailureHandler: function(fn){ _onFailure=fn; return proxy; }
  };
  // Attach every known function as a method
  Object.keys(_routes).forEach(function(fnName){
    proxy[fnName] = function() {
      var args = Array.prototype.slice.call(arguments);
      var route = _routes[fnName];
      var method = route.method || 'POST';
      var bodyData = (route.body && method === 'POST') ? route.body.apply(null, args) : null;
      var headers = { 'Content-Type': 'application/json' };
      if (route.auth) {
        var tok = _getToken();
        if (tok) headers['Authorization'] = 'Bearer ' + tok;
      }
      var opts = { method: method, headers: headers };
      if (bodyData !== null) opts.body = JSON.stringify(bodyData);

      fetch(API_BASE + route.url, opts)
        .then(function(resp){
          if (resp.status === 401) {
            // Token expired — force re-login
            _clearToken();
            ME = null;
            try { sessionStorage.removeItem('pgtrack_user'); } catch(e){}
            location.reload();
            return;
          }
          return resp.json();
        })
        .then(function(data){
          if (!data) return;
          var result = route.transform ? route.transform(data) : data;
          if (_onSuccess) _onSuccess(result);
        })
        .catch(function(err){
          if (_onFailure) _onFailure(err);
          else console.error('API error ['+fnName+']:', err);
        });
    };
  });
  return proxy;
}

// Silent reload — slim top progress bar only, app stays visible
var _pbTimer=null;
function silentReload(afterFn) {
  var pb=document.getElementById('progress-bar');
  pb.classList.remove('done'); pb.classList.add('active');
  pb.style.width='15%';
  var pct=15;
  _pbTimer=setInterval(function(){ pct=Math.min(pct+Math.random()*12,85); pb.style.width=pct+'%'; },300);

  function onDone(d){
    clearInterval(_pbTimer);
    pb.style.width='100%';
    setTimeout(function(){
      pb.classList.add('done');
      setTimeout(function(){ pb.classList.remove('active','done'); pb.style.width='0%'; },600);
    },120);
    if(d && d.ok){ store(d); renderAll(); }
    if(afterFn) afterFn();
  }
  function onErr(e){
    clearInterval(_pbTimer);
    pb.classList.remove('active'); pb.style.width='0%';
    toast('❌ Refresh failed: '+(e?e.message:''));
  }
  if(isSupervisor() && mySupervisorId()){
    gsr().withSuccessHandler(onDone).withFailureHandler(onErr).getDataForSupervisor(mySupervisorId());
  } else {
    gsr().withSuccessHandler(onDone).withFailureHandler(onErr).getData();
  }
}

// ═══ AUTO-POLL (Real-time sync) ════════════════════════════════════
// Every POLL_INTERVAL ms, check if data changed (via cheap token call).
// If changed → pull only Progress+Students (fast), merge into D, re-render.
// Full silentReload only if cohorts/milestones/settings change (token includes row counts).
// Pauses when page is hidden (tab not visible) to avoid wasted calls.
var POLL_INTERVAL = 30000; // 30 seconds — adjust in Settings if needed
var _pollTimer    = null;
var _lastToken    = '';
var _pollActive   = false;

function startAutoPoll() {
  stopAutoPoll();
  _pollActive = true;
  _pollTimer = setInterval(function(){
    if (document.hidden) return; // browser tab not visible — skip
    if (!ME) return;             // not logged in
    runPollCycle();
  }, POLL_INTERVAL);
  // Show live indicator in sidebar
  updatePollIndicator(true);
}

function stopAutoPoll() {
  _pollActive = false;
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
  updatePollIndicator(false);
}

function runPollCycle() {
  gsr().withSuccessHandler(function(r){
    if (!r || !r.ok) return;
    if (r.token === _lastToken) return; // nothing changed

    // Token changed — pull fresh progress+students (lightweight)
    gsr().withSuccessHandler(function(pr){
      if (!pr || !pr.ok) return;
      var changed = false;

      // Merge progress
      if (pr.progress) {
        var fresh = normaliseProgress(pr.progress);
        // Check if anything actually differs before re-rendering
        if (JSON.stringify(fresh) !== JSON.stringify(D.progress)) {
          D.progress = fresh;
          changed = true;
        }
      }

      // Merge students (Progress % and Status only — don't overwrite name/email edits in progress)
      if (pr.students) {
        pr.students.forEach(function(fs){
          var local = D.students.find(function(x){ return s(x.ID)===s(fs.ID); });
          if (local && (local.Progress !== fs.Progress || local.Status !== fs.Status)) {
            local.Progress = fs.Progress;
            local.Status   = fs.Status;
            changed = true;
          }
        });
      }

      if (changed) {
        _lastToken = r.token;
        // Re-render whichever tab is currently visible
        var activeTab = document.querySelector('.tab.on');
        if (activeTab) {
          var tid = activeTab.id;
          try {
            if (tid==='tab-overview')  { renderOverview(); buildSidebar(); }
            else if (tid==='tab-students') { renderStudents(); }
            else if (tid==='tab-timeline') { renderTimeline(); }
            else if (tid==='tab-cdetail')  {
              var cid = activeTab.dataset.cohortId;
              if (cid) renderCDetail(cid);
            }
            else if (tid==='tab-sdetail')  {
              var sid = activeTab.dataset.studentId;
              if (sid) renderSDetail(sid);
            }
            buildSidebar();
          } catch(e) { console.warn('poll re-render:', e); }
        }
        showPollFlash(); // brief visual indicator that data was refreshed
      }
      _lastToken = r.token;
    }).withFailureHandler(function(){}).getProgressOnly();
  }).withFailureHandler(function(){}).getChangeToken();
}

function showPollFlash() {
  // Brief green flash on the progress bar to signal background update
  var pb = document.getElementById('progress-bar');
  if (!pb) return;
  pb.style.background = 'linear-gradient(90deg,#10b981,#34d399)';
  pb.style.width = '100%';
  pb.classList.add('active');
  setTimeout(function(){
    pb.classList.add('done');
    setTimeout(function(){
      pb.classList.remove('active','done');
      pb.style.width = '0%';
      pb.style.background = '';
    }, 500);
  }, 200);
}

function ring(pct, sz, sw) {
  sz=sz||68; sw=sw||5;
  var r=(sz-sw*2)/2, c=2*Math.PI*r, d=(+pct/100)*c, cl=pCol(pct);
  return '<div class="ring" style="width:'+sz+'px;height:'+sz+'px">'
    +'<svg width="'+sz+'" height="'+sz+'">'
    +'<circle cx="'+(sz/2)+'" cy="'+(sz/2)+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="'+sw+'"/>'
    +'<circle cx="'+(sz/2)+'" cy="'+(sz/2)+'" r="'+r+'" fill="none" stroke="'+cl+'" stroke-width="'+sw+'" stroke-linecap="round"'
    +' stroke-dasharray="'+d+' '+(c-d)+'"/></svg>'
    +'<span class="ring-txt" style="font-size:'+(Math.round(sz/5.5))+'px;color:'+cl+'">'+pct+'%</span>'
    +'</div>';
}

  var acUG = ac.filter(function(c){ return c.Level==='UG'; });

  var acStudents = D.students.filter(function(x){
    return ac.some(function(c){ return s(c.ID)===s(x.CohortID); });

    var sts = D.students.filter(function(x){

    });

// Navigate to Students tab filtered by level + status
function filterStudentsTabLevel(level, status) {
  var existingTab = document.getElementById('tab-students');
  if (existingTab) existingTab.dataset.forceRebuild = '1';
  // Build cohort ID list for this level
  var levelCohorts = D.cohorts
    .filter(function(c){ return (c.Level||'PG')===level; })
    .map(function(c){ return String(c.ID); });
  // Filter students by level-cohort membership + optional status
  var shown = D.students.filter(function(x){
    if (levelCohorts.indexOf(String(x.CohortID)) === -1) return false;
    if (status && x.Status !== status) return false;
    return canSeeStudent(x);
  });
  // Render students tab with pre-filtered list injected
  renderStudents({ q:'', cohort:'', sup:'', status: status, _levelIds: levelCohorts });
  goTab('students');
  setTimeout(function(){
    var el = document.getElementById('ss');
    if (el) el.value = status;
    var main = document.getElementById('main');
    if (main) main.scrollTop = 0;
  }, 20);
}

function loadDeadlineAlerts() {
  var panel = document.getElementById('deadline-panel');
  if (!panel) return;
  panel.innerHTML = '<div class="gc sm" style="color:var(--sub);text-align:center;padding:12px"><div class="spin" style="margin:0 auto 8px"></div>Checking deadlines…</div>';
  gsr()
    .withSuccessHandler(function(r) { renderDeadlinePanel(r); })
    .withFailureHandler(function(e) {
      if (panel) panel.innerHTML = '<div class="gc sm" style="color:#f43f5e;padding:10px">⚠ Could not load deadlines: '+(e?e.message:'')+'</div>';
    })
    .getUpcomingDeadlines();
}

function renderDeadlinePanel(r) {
  var panel = document.getElementById('deadline-panel');
  if (!panel) return;
  if (!r || !r.ok || !r.alerts || r.alerts.length === 0) {
    panel.innerHTML = '<div class="gc sm mb8" style="border-color:rgba(16,185,129,.25);background:rgba(16,185,129,.06)">'
      +'<div class="flex gap8" style="align-items:center">'
      +'<span style="font-size:20px">✅</span>'
      +'<div><div class="bold small" style="color:#34d399">No upcoming deadlines</div>'
      +'<div class="xs muted">All milestone dates are more than '+(r&&r.warnDays||7)+' days away.</div></div></div></div>';
    return;
  }

  var overdueAlerts  = r.alerts.filter(function(a){ return a.daysLeft < 0; });
  var todayAlerts    = r.alerts.filter(function(a){ return a.daysLeft === 0; });
  var soonAlerts     = r.alerts.filter(function(a){ return a.daysLeft > 0; });

  var rows = r.alerts.map(function(a) {
    var isOverdue = a.daysLeft < 0;
    var isToday   = a.daysLeft === 0;
    var bc  = isOverdue ? '#f43f5e' : isToday ? '#f97316' : '#f59e0b';
    var tag = isOverdue ? '🔴 Overdue '+Math.abs(a.daysLeft)+'d'
            : isToday   ? '🟠 Due Today'
            : '🟡 '+a.daysLeft+'d left';
    var total = a.overdueCount + a.pendingCount;
    return '<div class="dl-row" onclick="openDeadlineDetail(\''+a.milestoneId+'\')">'
      +'<div style="width:3px;border-radius:2px;background:'+bc+';flex-shrink:0;align-self:stretch"></div>'
      +'<div style="flex:1;min-width:0">'
      +'<div class="fb xs"><span class="bold" style="color:var(--text)">'+esc(a.milestoneName)+'</span>'
      +'<span class="mono xs bold" style="color:'+bc+'">'+tag+'</span></div>'
      +'<div class="xs muted mt4">'+esc(a.cohortName)+' · <span style="color:'+bc+'">'+total+' student'+(total>1?'s':'')+' pending</span></div>'
      +'<div class="xs muted">Due: '+a.dueDate+'</div>'
      +'</div>'
      +(isSysAdmin()||isProgrammeHead()||isCoordinator()
        ? '<button class="btn xs" style="background:'+bc+'22;color:'+bc+';border:1px solid '+bc+'44;flex-shrink:0" '
          +'onclick="event.stopPropagation();sendReminderFor(\''+a.milestoneId+'\',\''+esc(a.milestoneName)+'\','+total+')">📧 Remind</button>'
        : '')
      +'</div>';
  }).join('');

  panel.innerHTML =
    '<div class="gc mb8" style="padding:0">'
    +'<div class="fb" style="padding:14px 16px;border-bottom:1px solid var(--border)">'
    +'<div><div class="bold small">🔔 Deadline Alerts</div>'
    +'<div class="xs muted">Within next '+(r.warnDays||7)+' days'
    +(overdueAlerts.length?' · <span style="color:#f43f5e">'+overdueAlerts.length+' overdue</span>':'')+'</div></div>'
    +(isSysAdmin()||isProgrammeHead()||isCoordinator() ? '<button class="btn prim xs" onclick="sendAllReminders()">📧 Send All Reminders</button>' : '')
    +'</div>'
    +'<div style="padding:8px 0">'+rows+'</div>'
    +'</div>';
}

function syncCohortCal(cid) {
  var c  = D.cohorts.find(function(x){ return s(x.ID)===s(cid); });
  var ms = cMs(cid).filter(function(m){ return m.WeekOffset && /^\d{4}-\d{2}-\d{2}$/.test(String(m.WeekOffset).trim()); });
  if (!ms.length) {
    toast('⚠ No milestone dates set for this cohort. Add dates via ✏ Milestones first.');
    return;
  }
  confirm2('📅','Sync to Google Calendar',
    'Create calendar events for '+ms.length+' milestone deadline(s) in cohort "'+esc(c?c.Name:'')+'"\n\nAll-day events will be added to a Google Calendar named "PG Track Milestones". Events with the same title on the same date are skipped.',
    'Sync','prim', function(){
      toast('⏳ Syncing to Google Calendar…');
      gsr().withSuccessHandler(function(r){
        if (!r) { toast('❌ No response from server'); return; }
        if (!r.ok) {
          // Check if it's a Calendar service not enabled error
          var errMsg = r.error || '';
          var isServiceErr = errMsg.indexOf('CalendarApp') >= 0
            || errMsg.indexOf('not available') >= 0
            || errMsg.indexOf('service') >= 0
            || errMsg.indexOf('Calendar service') >= 0
            || errMsg.indexOf('permission') >= 0
            || errMsg.indexOf('authoriz') >= 0;

          toast('❌ Sync failed — see details');
          openMo('📅 Calendar Sync Failed', false,
            '<div class="gc sm mb12" style="background:rgba(244,63,94,.06);border-color:rgba(244,63,94,.2)">'
            +'<div class="xs bold mb4" style="color:#f43f5e">Error</div>'
            +'<div class="xs muted">'+esc(errMsg)+'</div>'
            +'</div>'
            +(isServiceErr
              ? '<div class="gc sm" style="background:rgba(245,158,11,.06);border-color:rgba(245,158,11,.2)">'
                +'<div class="xs bold mb6" style="color:#fbbf24">How to enable Google Calendar:</div>'
                +'<div class="xs muted">'
                +'1. Open <strong>Extensions → Apps Script</strong><br>'
                +'2. In the left sidebar click <strong>+ Add a service</strong> (the + next to "Services")<br>'
                +'3. Find <strong>Google Calendar API</strong> → click Add<br>'
                +'4. Also make sure <strong>Calendar</strong> appears under Services<br>'
                +'5. Save → <strong>Deploy → New deployment</strong> → re-authorize<br>'
                +'6. Try syncing again'
                +'</div></div>'
              : '')
            +'<div class="flex gap8" style="justify-content:flex-end;margin-top:12px">'
            +'<button class="btn ghost" onclick="closeMo()">OK</button></div>'
          );
          return;
        }
        var msg = '✅ Synced '+r.synced+' event(s)';
        if (r.skipped) msg += ' · '+r.skipped+' already existed (skipped)';
        if (r.errors)  msg += ' · ⚠ '+r.errors+' failed';
        if (r.synced === 0 && r.skipped > 0) msg = 'ℹ All '+r.skipped+' event(s) already exist in calendar';
        toast(msg, r.errors ? 'warn' : 'success');
      }).withFailureHandler(function(e){
        toast('❌ Calendar sync error: '+(e?e.message:'unknown'));
      })
      .syncCohortToCalendar(cid);
    });
}

      :'<button class="btn ghost xs" style="flex:1" onclick="goDetail(\'c\',\''+c.ID+'\')">View →</button>')

    +(isSysAdmin()?'<button class="btn danger xs" onclick="delCohort(\''+c.ID+'\')">🗑</button>':'')

function renderCohorts(f) {
  f=f||{spec:'',sup:'',unit:''};
  var specs=[...new Set(D.cohorts.map(function(c){return c.Programme;}).filter(Boolean))];
  var units=[...new Set(D.cohorts.map(function(c){return c.Unit;}).filter(Boolean))];
  var supIds=[...new Set(D.students.map(function(x){return s(x.SupervisorID);}).filter(Boolean))];

  var filtered=D.cohorts.filter(function(c){
    if(f.spec&&c.Programme!==f.spec)return false;
    if(f.unit&&c.Unit!==f.unit)return false;
    if(f.sup){
      var hasSup=D.students.some(function(x){return s(x.CohortID)===s(c.ID)&&s(x.SupervisorID)===s(f.sup);});
      if(!hasSup)return false;
    }
    return true;
  });
  var active=filtered.filter(function(c){return c.Status==='Active';});
  var closed=filtered.filter(function(c){return c.Status==='Closed';});

  var specOpts=specs.map(function(v){return'<option value="'+esc(v)+'">'+esc(v)+'</option>';}).join('');
  var unitOpts=units.map(function(v){return'<option value="'+esc(v)+'">'+esc(v)+'</option>';}).join('');
  var supOpts2=supIds.map(function(id){return'<option value="'+id+'">'+supName(id)+'</option>';}).join('');

  var activeSection = active.length
    ? '<div class="st">Active Cohorts</div><div class="cgrid mb20">'+active.map(makeCohortCard).join('')+'</div>'
    : '<div class="gc sm mb20" style="text-align:center;color:var(--sub)">No active cohorts. Create one to get started.</div>';

  var closedSection = closed.length
    ? '<div class="st">Closed Cohorts</div><div class="cgrid">'+closed.map(makeCohortCard).join('')+'</div>'
    : '';

  set('tab-cohorts',
    '<div class="ph"><div class="ph-left"><div class="ph-title">Cohorts</div>'
    +'<div class="ph-sub">'+active.length+' active · '+closed.length+' closed</div></div>'
    +'<button class="btn prim" onclick="openAddCohort()" style="'+(canEdit()?'':'display:none')+'">＋ New Cohort</button></div>'
    +'<div class="flex gap8 mb16 fwrap">'
    +'<select class="sel" id="cf-spec" onchange="applyCoFilter()" style="max-width:180px"><option value="">All Programmes</option>'+specOpts+'</select>'
    +'<select class="sel" id="cf-unit" onchange="applyCoFilter()" style="max-width:180px"><option value="">All Units</option>'+unitOpts+'</select>'
    +'<select class="sel" id="cf-sup" onchange="applyCoFilter()" style="max-width:180px"><option value="">All Supervisors</option>'+supOpts2+'</select>'
    +(f.spec||f.unit||f.sup?'<button class="btn ghost sm" onclick="applyCoFilter(true)">✕ Clear</button>':'')
    +'</div>'
    +activeSection+closedSection
  );
  if(f.spec){ var e=document.getElementById('cf-spec'); if(e)e.value=f.spec; }
  if(f.unit){ var e=document.getElementById('cf-unit'); if(e)e.value=f.unit; }
  if(f.sup){  var e=document.getElementById('cf-sup');  if(e)e.value=f.sup; }
}
function applyCoFilter(clear){
  if(clear){ renderCohorts(); return; }
  renderCohorts({spec:val('cf-spec'),unit:val('cf-unit'),sup:val('cf-sup')});
}

// ═══ COHORT DETAIL ════════════════════════════════════════════════
function renderCDetail(cid, filterObj) {
  var c=D.cohorts.find(function(x){return s(x.ID)===s(cid);}); if(!c)return;
  var cl=col(cid), allSts=D.students.filter(function(x){return s(x.CohortID)===s(cid);}), ms=cMs(cid), av=avg_(allSts);
  var onT=0,del=0,rsk=0,don=0;
  allSts.forEach(function(x){ if(x.Status==='On Track')onT++; else if(x.Status==='Delayed')del++; else if(x.Status==='At Risk')rsk++; else if(x.Status==='Completed')don++; });

  // Build filter state
  var f = {};
  if (typeof filterObj === 'string') { f.sup = filterObj; }
  else if (filterObj && typeof filterObj === 'object') { f = filterObj; }
  if (!filterObj) {
    f.q     = (document.getElementById('cd-q')  ?document.getElementById('cd-q').value:'')  ||'';
    f.sup   = (document.getElementById('cd-sup')?document.getElementById('cd-sup').value:'') ||'';
    f.status= (document.getElementById('cd-st') ?document.getElementById('cd-st').value:'')  ||'';
    var specEl = document.getElementById('cd-spec-sel');
    f.specs = specEl ? (specEl.dataset.selected||'').split('|').filter(Boolean) : [];
  }
  f.q=f.q||''; f.sup=f.sup||''; f.status=f.status||''; f.specs=f.specs||[];

  // Filter options
  var supIds=[]; allSts.forEach(function(x){ if(x.SupervisorID&&supIds.indexOf(s(x.SupervisorID))===-1) supIds.push(s(x.SupervisorID)); });
  var supOpts=supIds.map(function(id){return'<option value="'+id+'"'+(s(f.sup)===id?' selected':'')+'>'+supName(id)+'</option>';}).join('');

  var specList=[]; allSts.forEach(function(x){

  });
  specList.sort();
  var specChips=specList.map(function(sp){

    return '<button type="button" class="btn xs" style="border-radius:20px;'+(sel?'background:var(--blue);color:#fff;border-color:var(--blue)':'background:var(--glass);color:var(--sub);border-color:var(--border)')+'" onclick="toggleCdSpec(\''+cid+'\',\''+esc(sp)+'\')">'+esc(sp)+'</button>';
  }).join('');

  // Apply filters
  var q=f.q.toLowerCase().trim();
  var sts=allSts.filter(function(x){
    if(f.sup    &&s(x.SupervisorID)!==s(f.sup))  return false;
    if(f.status &&x.Status!==f.status)            return false;
    if(f.specs.length){ var sp=(x.Specialisation||c.Unit||'').trim(); if(f.specs.indexOf(sp)===-1) return false; }
    if(q){ var hay=(String(x.Name||'')+String(x.RegNo||'')+String(x.Email||'')+String(x.Title||'')).toLowerCase(); if(hay.indexOf(q)===-1) return false; }

  var anyActive=f.q||f.sup||f.status||f.specs.length;

  var anyDates=ms.some(function(m){ return m.WeekOffset&&String(m.WeekOffset).trim()!==''; });
  var msHeatHeader='<div class="fb" style="align-items:center">'

  var msHeat=ms.map(function(m){
    var dc=allSts.filter(function(x){return isDone(x.ID,m.ID);}).length, pct=allSts.length?Math.round(dc/allSts.length*100):0;
    var bc=pct>=80?'#10b981':pct>=50?'#3b82f6':pct>=25?'#f59e0b':'#f43f5e';
    var deadlineBadge='', remindBtn='';
    var rawDate=m.WeekOffset||m.weekOffset||'';
    if(rawDate&&String(rawDate).trim()!==''){
      var dateStr=String(rawDate).trim().substring(0,10);
      var parts=dateStr.split('-');
      var dueMs=(parts.length===3?new Date(+parts[0],+parts[1]-1,+parts[2]):new Date(dateStr)).setHours(0,0,0,0);
      if(!isNaN(dueMs)){
        var daysLeft=Math.round((dueMs-todayMs)/86400000),pendingCount=allSts.length-dc,dc2,dtag,dbg;
        if(daysLeft<0){dc2='#f43f5e';dtag='🔴 Overdue '+Math.abs(daysLeft)+'d';dbg='rgba(244,63,94,.12)';}
        else if(daysLeft===0){dc2='#f97316';dtag='🟠 Due Today';dbg='rgba(249,115,22,.12)';}
        else if(daysLeft<=7){dc2='#f59e0b';dtag='🟡 '+daysLeft+'d left';dbg='rgba(245,158,11,.10)';}
        else{dc2='#6b7a99';dtag='📅 '+dateStr;dbg='transparent';}
        deadlineBadge='<span class="xs mono" style="background:'+dbg+';color:'+dc2+';border:1px solid '+dc2+'44;border-radius:5px;padding:1px 7px;margin-left:6px">'+dtag+'</span>';
        if(daysLeft<=7&&pendingCount>0&&(isSysAdmin()||isProgrammeHead()||isCoordinator())) remindBtn='<button class="btn xs" style="background:'+dc2+'22;color:'+dc2+';border:1px solid '+dc2+'44;margin-left:8px;flex-shrink:0" onclick="sendReminderFor(\''+m.ID+'\',\''+esc(m.Name)+'\','+pendingCount+')">📧 '+pendingCount+' pending</button>';
      }
    }
    return '<div class="msbar-row">'
      +'<div class="msbar-top"><div class="flex" style="align-items:center;flex-wrap:wrap;gap:4px;flex:1">'
      +'<span class="bold xs">'+m.Order+'. '+esc(m.Name)+'</span>'+deadlineBadge+'</div>'
      +'<div class="flex" style="align-items:center;gap:6px"><span class="xs muted">'+dc+' / '+allSts.length+' ('+pct+'%)</span>'+remindBtn+'</div></div>'
      +'<div class="msbar-bg">'
      +'<div class="msbar-fill" style="width:'+Math.max(pct,pct>0?1:0)+'%;background:'+bc+';min-width:'+(pct>0?'4px':'0')+'"></div>'
      +(pct===0?'<span style="position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--sub)">0% — not started</span>':'')
      +'</div></div>';
  }).join('');

  var rows=sts.map(function(x){
    var pct=+x.Progress, dc=sProg(x.ID).filter(function(p){return+p.Done>=1;}).length;
    return '<tr onclick="goDetail(\'s\',\''+x.ID+'\')">'
      +'<td><div class="bold">'+esc(x.Name)+'</div><div class="sub">'+esc(x.RegNo)+'</div></td>'
      +'<td class="muted small">'+supName(x.SupervisorID)+'</td>'

      +'<td class="xs muted">'+esc(x.Specialisation||'—')+'</td>'

      +'<div class="bar" style="flex:1"><div class="bar-fill" style="width:'+pct+'%;background:'+pCol(pct)+'"></div></div>'
      +'<span class="mono xs bold" style="color:'+pCol(pct)+'">'+pct+'%</span></div></td>'
      +'<td class="xs muted">'+dc+'/'+ms.length+'</td>'
      +'<td>'+sBadge(x.Status)+'</td>'
      +'<td><button class="btn ghost xs" onclick="event.stopPropagation();goDetail(\'s\',\''+x.ID+'\')">View →</button></td>'
      +'</tr>';
  }).join('');

  // ── Smart re-render: if same cohort detail is already showing, only patch student rows ──
  var cdTab = document.getElementById('tab-cdetail');
  var cdAlreadyBuilt = cdTab && cdTab.querySelector('#cd-q') && cdTab.dataset.cohortId === String(cid);

  if (cdAlreadyBuilt) {
    // Only patch student count badge and tbody
    var cdCount = cdTab.querySelector('.cd-count');
    if (cdCount) cdCount.textContent = sts.length + ' of ' + allSts.length + ' shown';
    var cdTb = cdTab.querySelector('tbody');
    if (cdTb) cdTb.innerHTML = rows || '<tr><td colspan="8" style="text-align:center;padding:20px;color:var(--sub)">No students match filters.</td></tr>';
    // Update spec-sel data attribute if changed
    var specEl2 = document.getElementById('cd-spec-sel');
    if (specEl2) specEl2.dataset.selected = f.specs.join('|');
    return;
  }

  set('tab-cdetail',
    '<button class="btn ghost sm mb16" onclick="goTab(\'cohorts\')">← Cohorts</button>'
    +'<div class="ph"><div class="ph-left"><div class="ph-title" style="color:'+cl+'">'+esc(c.Name)+'</div>'
    +'<div class="ph-sub">'+(c.Programme||'—')+' · '+(c.Unit||'—')+' · '+(c.Semester||'—')+'</div></div>'
    +'<div class="ph-actions">'+(c.Status==='Active'?'<span class="badge bg">Active</span>':'<span class="badge bp">Closed</span>')
    +'<button class="btn ghost sm" onclick="openCohortReport(\''+cid+'\')">📊 Report</button>'
    +'<button class="btn ghost sm" onclick="syncCohortCal(\''+cid+'\')">📅 Sync Calendar</button>'
    +(canEdit() ? '<button class="btn prim sm" onclick="openBulkAdd(\''+cid+'\')">📥 Bulk Add</button>' : '')
    +(canEdit() ? '<button class="btn ghost sm" onclick="openAddStudent(\''+cid+'\')">＋ Student</button>' : '')
    +(canEdit() ? '<button class="btn ghost sm" onclick="openEditMs(\''+cid+'\')">✏ Milestones</button>' : '')
    +(canEdit() ? '<button class="btn ghost sm" onclick="openEditCohort(\''+cid+'\')">✏ Edit</button>' : '')
    +(isSysAdmin() ? '<button class="btn danger sm" onclick="delCohort(\''+cid+'\')">🗑 Delete</button>' : '')
    +'</div></div>'
    +'<div class="stats mb16">'
    +scCard('Students',allSts.length,'all',cl,"applyCdTileFilter('"+cid+"','')")
    +scCard('On Track',onT,'','#10b981',"applyCdTileFilter('"+cid+"','On Track')")
    +scCard('Delayed',del,'','#f59e0b',"applyCdTileFilter('"+cid+"','Delayed')")
    +scCard('At Risk',rsk,'','#f43f5e',"applyCdTileFilter('"+cid+"','At Risk')")
    +scCard('Completed',don,'','#a78bfa',"applyCdTileFilter('"+cid+"','Completed')")
    +scCard('Avg',av+'%','progress',''+cl)
    +'</div>'
    +'<div class="grid2 mb16">'
    +'<div class="ic"><div class="ic-k">Start Date</div><div class="ic-v">'+(c.StartDate||'—')+'</div></div>'
    +'<div class="ic"><div class="ic-k">End Date</div><div class="ic-v">'+(c.EndDate||'—')+'</div></div>'
    +'</div>'
    +'<div class="gc mb16">'+msHeatHeader+msHeat+'</div>'
    +'<div class="tw"><div style="padding:12px 14px;border-bottom:1px solid var(--border)">'
    +'<div class="fb mb10"><div class="st" style="margin-bottom:0;flex:1">Students</div>'
    +'<span class="xs muted cd-count">'+(anyActive?sts.length+' of '+allSts.length+' shown':'')+'</span>'
    +'</div>'
    +'<div class="flex gap8 fwrap mb8">'
    +'<input class="inp" id="cd-q" placeholder="🔍 Search name, reg, email…" value="'+esc(f.q)+'" oninput="applyCdFilter(\''+cid+'\')" style="max-width:200px"/>'
    +(supIds.length>1?'<select class="sel" id="cd-sup" onchange="applyCdFilter(\''+cid+'\')" style="max-width:180px"><option value="">All Supervisors</option>'+supOpts+'</select>':'')
    +'<select class="sel" id="cd-st" onchange="applyCdFilter(\''+cid+'\')" style="max-width:150px">'
    +'<option value=""'+(f.status===''?' selected':'')+'>All Statuses</option>'
    +'<option'+(f.status==='On Track'?' selected':'')+'>On Track</option>'
    +'<option'+(f.status==='Delayed'?' selected':'')+'>Delayed</option>'
    +'<option'+(f.status==='At Risk'?' selected':'')+'>At Risk</option>'
    +'<option'+(f.status==='Completed'?' selected':'')+'>Completed</option>'
    +'</select>'
    +(anyActive?'<button class="btn ghost sm" onclick="renderCDetail(\''+cid+'\',{})">✕ Clear</button>':'')
    +'</div>'
    +(specList.length>1?'<div class="flex gap6 fwrap mb4" id="cd-spec-sel" data-selected="'+esc(f.specs.join('|'))+'">'
      +'<span class="xs muted" style="line-height:24px;margin-right:4px">Specialisation:</span>'+specChips+'</div>':'')
    +'</div>'
    +'<table><thead><tr><th>Student</th><th>Supervisor</th><th>Programme</th><th>Specialisation</th><th>Progress</th><th>Done</th><th>Status</th><th></th></tr></thead>'

var _cdFilterTimer = null;
function applyCdFilter(cid){
  clearTimeout(_cdFilterTimer);
  _cdFilterTimer = setTimeout(function(){
    var specEl=document.getElementById('cd-spec-sel');
    var specs=specEl?(specEl.dataset.selected||'').split('|').filter(Boolean):[];
    renderCDetail(cid,{
      q:     (document.getElementById('cd-q') ?document.getElementById('cd-q').value:''),
      sup:   (document.getElementById('cd-sup')?document.getElementById('cd-sup').value:''),
      status:(document.getElementById('cd-st') ?document.getElementById('cd-st').value:''),
      specs: specs
    });
  }, 120);
}

// Tile click filter — sets status dropdown and re-renders immediately
function applyCdTileFilter(cid, status) {
  // Scroll table into view smoothly
  var tab = document.getElementById('tab-cdetail');
  if (tab) { var tw = tab.querySelector('.tw'); if (tw) setTimeout(function(){ tw.scrollIntoView({behavior:'smooth',block:'nearest'}); }, 80); }
  renderCDetail(cid, {
    q: '', sup: '', specs: [],
    status: status
  });
  // After render, update the status dropdown to match
  setTimeout(function(){
    var el = document.getElementById('cd-st');
    if (el) el.value = status;
  }, 30);
}
function toggleCdSpec(cid,spec){
  var specEl=document.getElementById('cd-spec-sel'); if(!specEl)return;
  var cur=(specEl.dataset.selected||'').split('|').filter(Boolean);
  var idx=cur.indexOf(spec);
  if(idx>=0)cur.splice(idx,1); else cur.push(spec);
  renderCDetail(cid,{
    q:     (document.getElementById('cd-q') ?document.getElementById('cd-q').value:''),
    sup:   (document.getElementById('cd-sup')?document.getElementById('cd-sup').value:''),
    status:(document.getElementById('cd-st') ?document.getElementById('cd-st').value:''),
    specs: cur
  });
}

// ═══ STUDENTS ═════════════════════════════════════════════════════
function renderStudents(f) {
  // Preserve current filter values if called without args (e.g. from renderAll)
  if (!f) {
    f = {
      q:      (document.getElementById('sq')  ? document.getElementById('sq').value  : '') || '',
      cohort: (document.getElementById('sc2') ? document.getElementById('sc2').value : '') || '',
      status: (document.getElementById('ss')  ? document.getElementById('ss').value  : '') || '',
      sup:    (document.getElementById('sc3') ? document.getElementById('sc3').value : '') || ''
    };
  }
  var q = (f.q||'').toLowerCase().trim();
  var shown = D.students.filter(function(x){
    if (f.cohort && s(x.CohortID) !== s(f.cohort)) return false;
    if (f._levelIds && f._levelIds.indexOf(String(x.CohortID)) === -1) return false;
    if (f.status && x.Status !== f.status) return false;
    if (f.sup    && s(x.SupervisorID) !== s(f.sup)) return false;
    if (q) {
      var hay = (String(x.Name||'') + String(x.RegNo||'') + String(x.Title||'') + String(x.Email||'')).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  var coOpts  = D.cohorts.map(function(c){return'<option value="'+c.ID+'"'+(s(f.cohort)===s(c.ID)?' selected':'')+'>'+esc(c.Name)+'</option>';}).join('');
  var supIds  = []; D.students.forEach(function(x){ if(x.SupervisorID&&supIds.indexOf(s(x.SupervisorID))===-1) supIds.push(s(x.SupervisorID)); });
  var supOpts = supIds.map(function(id){return'<option value="'+id+'"'+(s(f.sup)===id?' selected':'')+'>'+supName(id)+'</option>';}).join('');
  var rows = shown.map(function(x){
    var pct=+x.Progress, cl=col(x.CohortID);
    return '<tr onclick="goDetail(\'s\',\''+x.ID+'\')">'
      +'<td><div class="flex gap8" style="align-items:center">'
      +'<div style="width:3px;height:32px;border-radius:2px;background:'+cl+';box-shadow:0 0 8px '+cl+'55;flex-shrink:0"></div>'
      +'<div><div class="bold">'+esc(x.Name)+'</div><div class="sub">'+esc(x.RegNo)+'</div></div>'
      +'</div></td>'
      +'<td class="xs muted" style="max-width:150px">'+cName(x.CohortID)+'</td>'
      +'<td class="xs muted">'+supName(x.SupervisorID)+'</td>'
      +'<td><div class="flex gap8" style="align-items:center;min-width:90px">'
      +'<div class="bar" style="flex:1"><div class="bar-fill" style="width:'+pct+'%;background:'+pCol(pct)+'"></div></div>'
      +'<span class="mono xs bold" style="color:'+pCol(pct)+'">'+pct+'%</span></div></td>'
      +'<td>'+sBadge(x.Status)+'</td>'
      +'<td><button class="btn ghost xs" onclick="event.stopPropagation();goDetail(\'s\',\''+x.ID+'\')">View →</button></td>'
      +'</tr>';
  }).join('');

  // ── Smart re-render: if students tab already exists just patch the tbody ──
  var existingTab = document.getElementById('tab-students');
  var tabAlreadyBuilt = existingTab && existingTab.querySelector('#sq') && !existingTab.dataset.forceRebuild;

  if (tabAlreadyBuilt) {
    // Only update the count sub-header and tbody — DO NOT touch inputs
    var subEl = existingTab.querySelector('.ph-sub');
    if (subEl) subEl.textContent = shown.length + ' / ' + D.students.filter(canSeeStudent).length + ' shown';
    var tb = existingTab.querySelector('tbody');
    if (tb) tb.innerHTML = rows || '<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--sub)">No students match your search.</td></tr>';
    // Show/hide clear button
    var clearBtn = existingTab.querySelector('.st-clear-btn');
    if (clearBtn) clearBtn.style.display = (f.q||f.cohort||f.status||f.sup) ? '' : 'none';
    return;
  }
  if (existingTab) existingTab.dataset.forceRebuild = '';

  set('tab-students',
    '<div class="ph"><div class="ph-left"><div class="ph-title">Students</div>'
    +'<div class="ph-sub">'+shown.length+' / '+D.students.length+' shown</div></div>'
    +'<button class="btn prim" onclick="openAddStudent()">＋ Add Student</button></div>'
    +'<div class="flex gap8 mb16 fwrap">'
    +'<input class="inp" id="sq" placeholder="🔍 Search name, reg, email, title…" oninput="applyFilter()" value="'+esc(f.q||'')+'" style="max-width:220px"/>'
    +'<select class="sel" id="sc2" onchange="applyFilter()" style="max-width:200px"><option value="">All Cohorts</option>'+coOpts+'</select>'
    +'<select class="sel" id="sc3" onchange="applyFilter()" style="max-width:190px"><option value="">All Supervisors</option>'+supOpts+'</select>'
    +'<select class="sel" id="ss"  onchange="applyFilter()" style="max-width:150px"><option value="">All Statuses</option>'
    +'<option'+(f.status==='On Track'?' selected':'')+'>On Track</option>'
    +'<option'+(f.status==='Delayed'?' selected':'')+'>Delayed</option>'
    +'<option'+(f.status==='At Risk'?' selected':'')+'>At Risk</option>'
    +'<option'+(f.status==='Completed'?' selected':'')+'>Completed</option>'
    +'</select>'
    +'<button class="btn ghost sm st-clear-btn" onclick="applyFilter(true)" style="'+(!(f.q||f.cohort||f.status||f.sup)?'display:none':'')+'">✕ Clear</button>'
    +'</div>'
    +'<div class="tw"><table><thead><tr><th>Student</th><th>Cohort</th><th>Supervisor</th><th>Progress</th><th>Status</th><th></th></tr></thead>'
    +'<tbody>'+(rows||'<tr><td colspan="6" style="text-align:center;padding:20px;color:var(--sub)">No students match your search.</td></tr>')+'</tbody></table></div>'
  );
}
var _filterTimer = null;
function applyFilter(clear){
  if (clear) {
    // Reset all inputs manually, then rebuild table
    var sq = document.getElementById('sq'); if(sq) sq.value = '';
    var sc2= document.getElementById('sc2'); if(sc2) sc2.value = '';
    var sc3= document.getElementById('sc3'); if(sc3) sc3.value = '';
    var ss = document.getElementById('ss');  if(ss)  ss.value = '';
    // Force full re-render to remove clear button etc.
    var tab = document.getElementById('tab-students');
    if (tab) { var inp = tab.querySelector('#sq'); if(inp) inp.value=''; }
    renderStudents({q:'',cohort:'',status:'',sup:''});
    return;
  }
  // Debounce: clear old timer, fire after 120ms so cursor is never lost mid-typing
  clearTimeout(_filterTimer);
  _filterTimer = setTimeout(function(){
    renderStudents({
      q:      val('sq'),
      cohort: val('sc2'),
      sup:    val('sc3'),
      status: val('ss')
    });
  }, 120);
}

// ── Tile click → Students tab with status pre-filtered ─────────────
function filterStudentsTab(status) {
  // Flag the tab for full rebuild so the status dropdown gets replaced with correct selected value
  var existingTab = document.getElementById('tab-students');
  if (existingTab) existingTab.dataset.forceRebuild = '1';
  renderStudents({ q:'', cohort:'', sup:'', status: status });
  goTab('students');
  // Sync dropdown and scroll after render
  setTimeout(function(){
    var el = document.getElementById('ss');
    if (el) el.value = status;
    var cb = document.querySelector('#tab-students .st-clear-btn');
    if (cb) cb.style.display = status ? '' : 'none';
    var main = document.getElementById('main');
    if (main) main.scrollTop = 0;
  }, 20);
}

// ═══ STUDENT DETAIL ═══════════════════════════════════════════════
function renderSDetail(sid) {
  var x=D.students.find(function(v){return s(v.ID)===s(sid);}); if(!x)return;
  var c=D.cohorts.find(function(v){return s(v.ID)===s(x.CohortID);})||{};
  var ms=cMs(x.CohortID), cl=col(x.CohortID), pct=+x.Progress;
  var done=sProg(sid).filter(function(p){return+p.Done===1;}).length;
  var logs=D.logs.filter(function(l){return s(l.StudentID)===s(sid);}).sort(function(a,b){return b.Date.localeCompare(a.Date);});

  var msHTML=ms.map(function(m){
    var dv = getDoneVal(x.ID,m.ID); // 0=Pending, 1=Submitted, 2=Approved
    var stateLabel = dv===2?'✓ Approved':dv===1?'⏳ Submitted':'○ Pending';
    var stateColor = dv===2?'#10b981':dv===1?'#f59e0b':'#6b7a99';
    var bgStyle    = dv===2?'background:rgba(16,185,129,.07);border-color:rgba(16,185,129,.2)'
                   : dv===1?'background:rgba(245,158,11,.06);border-color:rgba(245,158,11,.22)'
                   : 'background:rgba(0,0,0,.15);border-color:var(--border)';
    var dateLabel  = m.WeekOffset ? ' · 📅 '+m.WeekOffset : '';
    // Find last update info from progress
    var pr = D.progress.find(function(p){ return s(p.StudentID)===s(x.ID)&&s(p.MilestoneID)===s(m.ID); });
    var lastUpdate = (pr && pr.Date && dv>0) ? ' · Updated '+pr.Date : '';
    var updatedBy  = (pr && pr.UpdatedBy && dv>0) ? ' by '+pr.UpdatedBy : '';
    var canApprove = isSysAdmin() || isCoordinator() || (isSupervisor() && s(x.SupervisorID) === s(mySupervisorId()));
    var canSubmit  = !isViewer() && !isProgrammeHead();
    var opts = '<option value="0"'+(dv===0?' selected':'')+'>○ Pending</option>'
      +(canSubmit?'<option value="1"'+(dv===1?' selected':'')+'>⏳ Submitted — awaiting approval</option>':'')
      +(canApprove?'<option value="2"'+(dv===2?' selected':'')+'>✓ Approved</option>':'');
    return '<div class="msck" style="'+bgStyle+';flex-direction:column;align-items:stretch;gap:6px;padding:11px 14px">'
      // Row 1: milestone name + date
      +'<div class="flex" style="align-items:center;justify-content:space-between;gap:8px">'

    +'<div class="xs muted">'+done+' of '+ms.length+' milestones done</div>'
    // Last update info — find most recent progress entry with an updater
    +(function(){
      var withUser = D.progress.filter(function(p){ return s(p.StudentID)===s(x.ID) && p.UpdatedBy && p.Date; });

      withUser.sort(function(a,b){ return String(b.Date).localeCompare(String(a.Date)); });

      var mName = (cMs(x.CohortID).find(function(m){ return s(m.ID)===s(last.MilestoneID); })||{}).Name||'';
