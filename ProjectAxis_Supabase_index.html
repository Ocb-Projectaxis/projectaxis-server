// ═══ TIMELINE ═════════════════════════════════════════════════════
function renderTimeline() {
  var active = D.cohorts.filter(function(c){ return c.Status==='Active'; });
  if (isSupervisor()) {
    active = active.filter(function(c){
      return D.students.some(function(x){ return s(x.CohortID)===s(c.ID) && canSeeStudent(x); });
    });
  }
  if (!active.length) {
    set('tab-timeline',
      '<div class="ph"><div class="ph-left"><div class="ph-title">Timeline</div>'
      +'<div class="ph-sub">Milestone completion · active cohorts</div></div></div>'
      +'<div class="gc" style="text-align:center;padding:40px;color:var(--sub)">No active cohorts found.</div>');
    return;
  }

  // ── Build left-sidebar cohort cards ─────────────────────────────
  var cohortCards = active.map(function(c, i){
    var cl  = COLORS[D.cohorts.indexOf(c) % COLORS.length];
    var sts = D.students.filter(function(x){ return s(x.CohortID)===s(c.ID); });
    var ms  = cMs(c.ID);
    var doneCount=0, submCount=0, pendCount=0;
    sts.forEach(function(x){ ms.forEach(function(m){
      var dv=getDoneVal(x.ID,m.ID);
      if(dv===2)doneCount++; else if(dv===1)submCount++; else pendCount++;
    }); });
    var totalCells = sts.length * ms.length || 1;
    var pctApproved = Math.round(doneCount/totalCells*100);
    return '<div id="tlcard-'+c.ID+'" onclick="tlSwitchCohort(\''+c.ID+'\')" '
      +'style="padding:14px 16px;border-radius:12px;cursor:pointer;margin-bottom:8px;'
      +'border:2px solid '+(i===0?cl:'var(--border)')+';'
      +'background:'+(i===0?cl+'12':'var(--glass)')+';'
      +'transition:all .18s">'
      // Coloured top stripe
      +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
      +'<div style="width:10px;height:10px;border-radius:50%;background:'+cl+';flex-shrink:0;box-shadow:0 0 8px '+cl+'88"></div>'
      +'<div class="bold xs" style="color:'+cl+';line-height:1.3;flex:1">'+esc(c.Name)+'</div>'
      +'</div>'
      +'<div class="xs muted mb8">'+sts.length+' students · '+ms.length+' milestones</div>'
      // Mini progress bar
      +'<div style="height:4px;border-radius:2px;background:var(--muted);margin-bottom:6px">'
      +'<div style="height:100%;width:'+pctApproved+'%;border-radius:2px;background:'+cl+'"></div></div>'
      +'<div style="display:flex;gap:6px;flex-wrap:wrap">'
      +(doneCount?'<span style="font-size:9px;color:#34d399;background:rgba(16,185,129,.12);padding:1px 6px;border-radius:3px">'+doneCount+' ✓</span>':'')
      +(submCount?'<span style="font-size:9px;color:#fbbf24;background:rgba(245,158,11,.12);padding:1px 6px;border-radius:3px">'+submCount+' ⏳</span>':'')
      +(pendCount?'<span style="font-size:9px;color:var(--sub);background:var(--glass);padding:1px 6px;border-radius:3px">'+pendCount+' ○</span>':'')
      +'</div>'
      +'</div>';
  }).join('');

  // ── Legend ───────────────────────────────────────────────────────
  var legend = '<div class="flex gap10 fwrap mb12" style="align-items:center">'
    +'<span class="xs bold muted">LEGEND</span>'
    +'<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px">'
    +'<span style="width:14px;height:14px;border-radius:3px;background:rgba(16,185,129,.18);border:1px solid rgba(16,185,129,.35);display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#34d399">✓</span>'
    +'<span class="muted">Approved</span></span>'
    +'<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px">'
    +'<span style="width:14px;height:14px;border-radius:3px;background:rgba(245,158,11,.15);border:1px solid rgba(245,158,11,.35);display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fbbf24">⏳</span>'
    +'<span class="muted">Submitted</span></span>'
    +'<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px">'
    +'<span style="width:14px;height:14px;border-radius:3px;background:rgba(0,0,0,.2);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:var(--muted)">○</span>'
    +'<span class="muted">Pending</span></span>'
    +'</div>';

  // ── Build grid panels for each cohort ───────────────────────────
  var panels = active.map(function(c, i) {
    var allSts = D.students.filter(function(x){ return s(x.CohortID)===s(c.ID); });
    var sts    = isSupervisor() ? allSts.filter(canSeeStudent) : allSts;
    var ms     = cMs(c.ID);
    var cl     = COLORS[D.cohorts.indexOf(c) % COLORS.length];

    var panelHtml = '<div id="tl-panel-'+c.ID+'" style="'+(i===0?'':'display:none')+'">';

    if (!sts.length) {
      return panelHtml+'<div class="gc" style="text-align:center;padding:40px;color:var(--sub)">No students in this cohort yet.</div></div>';
    }
    if (!ms.length) {
      return panelHtml+'<div class="gc" style="text-align:center;padding:40px;color:var(--sub)">No milestones configured.</div></div>';
    }

    // Scrollable grid
    panelHtml += '<div style="overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--glass)">';
    panelHtml += '<div style="min-width:max-content">';

    // Header row
    panelHtml += '<div style="display:flex;align-items:center;gap:6px;padding:8px 16px;'
      +'background:rgba(0,0,0,.28);border-radius:11px 11px 0 0;border-bottom:1px solid var(--border)">'
      +'<div style="width:190px;flex-shrink:0;font-size:9px;font-weight:700;color:var(--sub);letter-spacing:.8px">STUDENT</div>'
      + ms.map(function(m){
          var mname = String(m.Name||'?');
          var short = mname.length>12 ? mname.substring(0,11)+'…' : mname;
          var dlColor='';
          if(m.WeekOffset && /^\d{4}-\d{2}-\d{2}$/.test(String(m.WeekOffset).trim())){
            var p=String(m.WeekOffset).split('-');
            var dl=Math.round((new Date(+p[0],+p[1]-1,+p[2]).setHours(0,0,0,0)-todayMs)/86400000);
            dlColor=dl<0?'#f43f5e':dl<=7?'#f59e0b':'';
          }
          return '<div style="width:60px;flex-shrink:0;text-align:center;font-size:9px;font-weight:700;'
            +'color:'+(dlColor||'var(--sub)')+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap" '
            +'title="'+esc(mname)+(m.WeekOffset?' · Due: '+m.WeekOffset:'')+'">'
            +esc(short)+'</div>';
        }).join('')
      +'<div style="width:52px;flex-shrink:0;text-align:right;font-size:9px;font-weight:700;color:var(--sub)">PROG</div>'
      +'<div style="width:74px;flex-shrink:0;text-align:center;font-size:9px;font-weight:700;color:var(--sub)">STATUS</div>'
      +'</div>';

    // Student rows
    sts.forEach(function(x, ri){
      var pct = +x.Progress;
      var boxes = ms.map(function(m){
        var dv=getDoneVal(x.ID,m.ID);
        var bg,border,color,icon;
        if(dv===2){bg='rgba(16,185,129,.18)';border='rgba(16,185,129,.35)';color='#34d399';icon='✓';}
        else if(dv===1){bg='rgba(245,158,11,.15)';border='rgba(245,158,11,.35)';color='#fbbf24';icon='⏳';}
        else{bg='rgba(0,0,0,.14)';border='rgba(255,255,255,.06)';color='rgba(255,255,255,.2)';icon='○';}
        return '<div style="width:60px;flex-shrink:0;text-align:center;font-size:13px;font-weight:700;'
          +'padding:6px 2px;border-radius:6px;background:'+bg+';color:'+color+';border:1px solid '+border+'" '
          +'title="'+esc(m.Name||'')+' · '+(dv===2?'Approved':dv===1?'Submitted':'Pending')+'">'+icon+'</div>';
      }).join('');

      var stColor = x.Status==='On Track'?'#10b981':x.Status==='Completed'?'#a78bfa':x.Status==='At Risk'?'#f43f5e':'#f59e0b';
      var rowBg   = ri%2===0?'transparent':'rgba(255,255,255,.015)';

      panelHtml += '<div class="tl-row" data-name="'+esc(x.Name).toLowerCase()+' '+esc(x.RegNo).toLowerCase()+'" '
        +'onclick="goDetail(\'s\',\''+x.ID+'\')" '
        +'style="display:flex;align-items:center;gap:6px;padding:7px 16px;'
        +'border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;'
        +'background:'+rowBg+';transition:background .12s" '
        +'onmouseover="this.style.background=\'rgba(255,255,255,.04)\'" '
        +'onmouseout="this.style.background=\''+rowBg+'\'">'
        +'<div style="width:190px;flex-shrink:0;overflow:hidden">'
        +'<div style="font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(x.Name)+'</div>'
        +'<div style="font-size:9px;color:var(--sub)">'+esc(x.RegNo)+'</div>'
        +'</div>'
        + boxes
        +'<div style="width:52px;flex-shrink:0;text-align:right">'
        +'<span class="mono bold" style="font-size:11px;color:'+pCol(pct)+'">'+pct+'%</span></div>'
        +'<div style="width:74px;flex-shrink:0;text-align:center">'
        +'<span style="font-size:9px;font-weight:700;color:'+stColor+';background:'+stColor+'15;'
        +'border:1px solid '+stColor+'30;border-radius:4px;padding:2px 7px;white-space:nowrap">'+esc(x.Status)+'</span>'
        +'</div>'
        +'</div>';
    });

    panelHtml += '</div></div>'; // min-width + scrollable
    panelHtml += '</div>'; // panel
    return panelHtml;
  }).join('');

  // ── Assemble final layout ────────────────────────────────────────
  set('tab-timeline',
    // Page header
    '<div class="ph"><div class="ph-left"><div class="ph-title">Timeline</div>'
    +'<div class="ph-sub">Milestone completion · active cohorts only</div></div>'
    // Search box in header actions
    +'<div class="ph-actions"><input class="inp" id="tl-search" placeholder="🔍 Search student…" '
    +'oninput="tlFilter()" style="max-width:200px"/></div>'
    +'</div>'
    // Legend
    + legend
    // Two-column layout: sidebar (cohort cards) | main (grid)
    +'<div style="display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start">'
    // Left: cohort selector
    +'<div style="position:sticky;top:0">'
    +'<div class="xs bold muted mb8" style="letter-spacing:.8px;padding:0 4px">COHORTS</div>'
    + cohortCards
    +'</div>'
    // Right: grid panels
    +'<div>'+ panels +'</div>'
    +'</div>'
  );
}

// Switch active cohort — update sidebar cards + show correct panel
function tlSwitchCohort(cid) {
  var active = D.cohorts.filter(function(c){ return c.Status==='Active'; });
  // Update sidebar cards
  active.forEach(function(c){
    var card = document.getElementById('tlcard-'+c.ID);
    if (!card) return;
    var cl = COLORS[D.cohorts.indexOf(c) % COLORS.length];
    var isSelected = s(c.ID) === s(cid);
    card.style.border = '2px solid ' + (isSelected ? cl : 'var(--border)');
    card.style.background = isSelected ? cl+'12' : 'var(--glass)';
  });
  // Show/hide panels
  document.querySelectorAll('[id^="tl-panel-"]').forEach(function(el){ el.style.display='none'; });
  var panel = document.getElementById('tl-panel-'+cid);
  if (panel) panel.style.display = '';
  // Re-apply search
  tlFilter();
}

// Search filter — searches across the VISIBLE panel only
function tlFilter() {
  var q = ((document.getElementById('tl-search')||{}).value || '').toLowerCase().trim();
  // Find which panel is visible
  var visiblePanel = null;
  document.querySelectorAll('[id^="tl-panel-"]').forEach(function(el){
    if (el.style.display !== 'none') visiblePanel = el;
  });
  var rows = visiblePanel
    ? visiblePanel.querySelectorAll('.tl-row')
    : document.querySelectorAll('.tl-row');
  rows.forEach(function(row){
    if (!q) { row.style.display='flex'; return; }
    var name = (row.dataset.name || row.textContent).toLowerCase();
    row.style.display = name.indexOf(q) >= 0 ? 'flex' : 'none';
  });
}


// ── Patch Timeline after any progress change ──────────────────────
// Called after every milestone tick. Re-renders the full Timeline tab
// if it has been built (panels exist in DOM), regardless of which tab
// is currently active. This ensures the milestone grid never shows stale data.
function patchTimeline() {
  var tlPanel = document.querySelector('[id^="tl-panel-"]');
  if (!tlPanel) return; // timeline has never been rendered — nothing to patch
  renderTimeline();
  // Preserve the currently selected cohort after re-render
  var activeCid = null;
  document.querySelectorAll('[id^="tlcard-"]').forEach(function(card){
    if (card.style.border && card.style.border.indexOf('var(--border)') === -1) {
      activeCid = card.id.replace('tlcard-','');
    }
  });
  if (activeCid) tlSwitchCohort(activeCid);
}

// ═══ USERS ════════════════════════════════════════════════════════
function renderUsers() {
  if (!canManageUsers()) { set('tab-users','<div class="ph"><div class="ph-title">Access Denied</div></div>'); return; }
  gsr().withSuccessHandler(function(r) {
    if (!r || !r.ok) { set('tab-users','<div style="color:#f43f5e;padding:20px">Could not load users: '+(r?r.error:'')+'</div>'); return; }
    var rows = (r.users||[]).map(function(u) {
      var rl = roleLabel(u.role);
      var lastLogin = u.lastLogin ? String(u.lastLogin).substring(0,10) : 'Never';
      var supLink   = u.role==='supervisor'&&u.supervisorId
        ? '<span class="xs muted">→ '+supName(u.supervisorId)+'</span>' : '';
      return '<tr>'
        +'<td><div class="bold">'+esc(u.fullName)+'</div><div class="sub">'+esc(u.username)+'</div></td>'
        +'<td><span class="badge" style="background:'+rl.color+'22;color:'+rl.color+';border:1px solid '+rl.color+'44">'+rl.label+'</span></td>'
        +'<td class="xs muted">'+esc(u.email||'—')+'</td>'
        +'<td class="xs">'+supLink+'</td>'
        +'<td class="xs muted">'+lastLogin+'</td>'
        +'<td><span style="color:'+(u.active?'#10b981':'#f43f5e')+'">'+( u.active?'✓ Active':'✗ Inactive')+'</span></td>'
        +'<td class="flex gap6">'
        +'<button class="btn ghost xs" onclick="openEditUser(\''+u.id+'\',\''+esc(u.username)+'\',\''+esc(u.role)+'\',\''+esc(u.fullName)+'\',\''+esc(u.email||'')+'\','+u.active+',\''+esc(u.supervisorId||'')+'\')">✏ Edit</button>'
        +'<button class="btn ghost xs" style="color:#f59e0b;border-color:rgba(245,158,11,.25)" onclick="openResetPassword(\''+u.id+'\',\''+esc(u.fullName)+'\',\''+esc(u.username)+'\')">🔑 Reset</button>'
        +(String(u.username).toLowerCase()!=='admin'?'<button class="btn danger xs" onclick="removeUser(\''+u.id+'\',\''+esc(u.fullName)+'\')">🗑</button>':'')
        +'</td></tr>';
    }).join('');
    set('tab-users',
      '<div class="ph"><div class="ph-left"><div class="ph-title">User Management</div>'
      +'<div class="ph-sub">'+(r.users||[]).length+' user(s) · System Admin only</div></div>'
      +'<div class="ph-actions"><button class="btn prim" onclick="openAddUser()">＋ Add User</button></div></div>'
      +'<div class="gc sm mb16">'
      +'<div class="st" style="margin-bottom:10px">Authority Levels</div>'
      +ROLES.map(function(r2){
        return '<div style="display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px solid var(--border)">'
          +'<span class="badge" style="background:'+r2.color+'22;color:'+r2.color+';border:1px solid '+r2.color+'44;flex-shrink:0">'+r2.label+'</span>'
          +'<span class="xs muted">'+r2.desc+'</span></div>';
      }).join('')
      +'</div>'
      +'<div class="tw"><table><thead><tr><th>User</th><th>Role</th><th>Email</th><th>Supervisor Link</th><th>Last Login</th><th>Status</th><th></th></tr></thead>'
      +'<tbody>'+rows+'</tbody></table></div>'
      +'<div class="mt8 xs muted">For <strong>Supervisor</strong> accounts: link to their record in the Supervisors sheet. For <strong>Programme Head</strong>: cross-cohort view, no edits.</div>'
    );
  }).withFailureHandler(function(e){ set('tab-users','<div style="color:#f43f5e;padding:20px">Error: '+(e?e.message:'')+'</div>'); })
  .getUsers();
}

function roleOptions(selected) {
  return ROLES.map(function(r2){
    return '<option value="'+r2.value+'"'+(selected===r2.value?' selected':'')+'>'+r2.label+'</option>';
  }).join('');
}

function toggleSupField(prefix, role) {
  var row = document.getElementById(prefix+'-sup-row');
  if (row) row.style.display = (role === 'supervisor') ? '' : 'none';
}

function submitAddUser() {
  var name=val('nu-name'), user=val('nu-user'), pass=val('nu-pass'), role=val('nu-role'), email=val('nu-email');
  var supId = role === 'supervisor' ? val('nu-sup') : '';
  if (!name||!user||!pass) { toast('⚠ Name, username and password required'); return; }
  if (pass.length < 6) { toast('⚠ Password must be at least 6 characters'); return; }
  if (role === 'supervisor' && !supId) { toast('⚠ Please select a linked supervisor for this account'); return; }
  toast('⏳ Creating user…'); closeMo();
  gsr().withSuccessHandler(function(r){
    if (!r||!r.ok) { toast('❌ '+(r?r.error:'failed')); return; }
    toast('✅ User created!'); renderUsers();
  }).withFailureHandler(function(e){ toast('❌ '+(e?e.message:'')); })
  .saveUser(null, user, pass, role, name, email, true, supId);
}

function openEditUser(id, username, role, fullName, email, active, supervisorId) {
  var isSelf = ME && String(ME.username).toLowerCase() === String(username).toLowerCase();
  var supOpts = D.supervisors.map(function(sv){
    return '<option value="'+sv.ID+'"'+(s(sv.ID)===s(supervisorId||'')?' selected':'')+'>'+esc(sv.Name)+'</option>';
  }).join('');
  openMo('Edit User — '+fullName, false,
    '<div class="frow"><div class="fg"><label class="lbl">Full Name</label><input class="inp" id="eu-name" value="'+esc(fullName)+'"/></div>'
    +'<div class="fg"><label class="lbl">Username</label><input class="inp" id="eu-user" value="'+esc(username)+'"'+(username==='admin'?' readonly':'')+'/></div></div>'
    +'<div class="fg mb4"><label class="lbl">New Password <span style="font-weight:400;text-transform:none">(leave blank to keep current)</span></label>'
    +'<input class="inp" type="password" id="eu-pass" placeholder="Leave blank to keep current password"/></div>'
    +'<div class="frow"><div class="fg"><label class="lbl">Role</label>'
    +'<select class="sel" id="eu-role"'+(isSelf?' disabled':'')+' onchange="toggleSupField(\'eu\',this.value)">'
    +roleOptions(role)
    +'</select></div>'
    +'<div class="fg"><label class="lbl">Email</label><input class="inp" type="email" id="eu-email" value="'+esc(email)+'"/></div></div>'
    +'<div class="fg mb4" id="eu-sup-row" style="'+(role==='supervisor'?'':'display:none')+'">'
    +'<label class="lbl">Linked Supervisor</label>'
    +'<select class="sel" id="eu-sup"><option value="">— select supervisor —</option>'+supOpts+'</select>'
    +'<div class="xs muted mt4">This supervisor account will only see students assigned to this person.</div>'
    +'</div>'
    +(isSelf?'':'<div class="fg"><label class="lbl">Status</label>'
    +'<select class="sel" id="eu-active"><option value="true"'+(active?' selected':'')+'>Active</option><option value="false"'+(!active?' selected':'')+'>Inactive</option></select></div>')
    +'<div class="flex gap8" style="justify-content:flex-end;margin-top:12px">'
    +'<button class="btn ghost" onclick="closeMo()">Cancel</button>'
    +'<button class="btn prim" onclick="submitEditUser(\''+id+'\',\''+esc(username)+'\','+isSelf+')">Save Changes</button></div>'
  );
}

function submitEditUser(id, origUsername, isSelf) {
  var name=val('eu-name'), user=val('eu-user'), pass=val('eu-pass')||null,
      role=isSelf?meRole():val('eu-role'), email=val('eu-email'),
      activeStr=isSelf?'true':(document.getElementById('eu-active')?val('eu-active'):'true');
  var active = activeStr !== 'false';
  var supId  = (role==='supervisor') ? val('eu-sup') : '';
  if (!name||!user) { toast('⚠ Name and username required'); return; }
  if (pass && pass.length < 6) { toast('⚠ New password must be at least 6 characters'); return; }
  if (role==='supervisor' && !supId) { toast('⚠ Please select a linked supervisor for this account'); return; }
  toast('⏳ Saving…'); closeMo();
  gsr().withSuccessHandler(function(r){
    if (!r||!r.ok) { toast('❌ '+(r?r.error:'failed')); return; }
    if (isSelf && ME) {
      ME.fullName = name; ME.email = email;
      try { sessionStorage.setItem('pgtrack_user', JSON.stringify(ME)); } catch(e){}
    }
    toast('✅ User updated!'); renderUsers();
    if (isSelf) {
      document.getElementById('user-name').textContent   = name;
      document.getElementById('user-avatar').textContent = name.charAt(0).toUpperCase();
    }
  }).withFailureHandler(function(e){ toast('❌ '+(e?e.message:'')); })
  .saveUser(id, user, pass, role, name, email, active, supId);
}

// ── Admin password reset (no old password needed) ─────────────────
function openResetPassword(userId, fullName, username) {
  // Self-reset: use the change-own-password flow
  var isSelf = ME && String(ME.username).toLowerCase() === String(username).toLowerCase();
  if (isSelf) { openChangePassword(); return; }

  openMo('🔑 Reset Password — '+fullName, false,
    '<div class="gc sm mb12" style="background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.25)">'
    +'<div class="xs" style="color:#fbbf24">⚠ This will immediately replace <strong>'+esc(fullName)+'\'s</strong> password. They will need the new password to log in next time.</div>'
    +'</div>'
    +'<div class="fg mb4"><label class="lbl">New Password</label>'
    +'<input class="inp" type="password" id="rp-new" placeholder="Minimum 6 characters" autocomplete="new-password"/></div>'
    +'<div class="fg mb16"><label class="lbl">Confirm New Password</label>'
    +'<input class="inp" type="password" id="rp-conf" placeholder="Repeat new password" autocomplete="new-password"/></div>'
    +'<div class="flex gap8" style="justify-content:flex-end">'
    +'<button class="btn ghost" onclick="closeMo()">Cancel</button>'
    +'<button class="btn prim" style="background:linear-gradient(135deg,#f59e0b,#f97316)" onclick="submitResetPassword(\''+userId+'\',\''+esc(fullName)+'\')">🔑 Set New Password</button>'
    +'</div>'
  );
  setTimeout(function(){ var el=document.getElementById('rp-new'); if(el)el.focus(); }, 80);
}

function submitResetPassword(userId, fullName) {
  var nw   = val('rp-new');
  var conf = val('rp-conf');
  if (!nw)           { toast('⚠ Please enter a new password'); return; }
  if (nw.length < 6) { toast('⚠ Password must be at least 6 characters'); return; }
  if (nw !== conf)   { toast('⚠ Passwords do not match'); return; }
  toast('⏳ Resetting password…'); closeMo();
  gsr().withSuccessHandler(function(r){
    if (!r||!r.ok) { toast('❌ '+(r?r.error:'Failed to reset password')); return; }
    toast('✅ Password reset for '+fullName+'!');
  }).withFailureHandler(function(e){ toast('❌ '+(e?e.message:'')); })
  .adminResetPassword(userId, nw);
}

function removeUser(id, fullName) {
  confirm2('🗑️','Remove User',
    'Remove user "'+fullName+'"? They will no longer be able to log in.',
    'Remove','danger', function(){
      toast('⏳ Removing…');
      gsr().withSuccessHandler(function(r){
        if (!r||!r.ok) { toast('❌ '+(r?r.error:'failed')); return; }
        toast('✅ User removed'); renderUsers();
      }).withFailureHandler(function(e){ toast('❌ '+(e?e.message:'')); })
      .deleteUser(id);
    });
}

// Change own password modal — accessible from Settings tab
function openChangePassword() {
  openMo('Change My Password', false,

    +'<div class="fg mb4"><label class="lbl">New Password</label><input class="inp" type="password" id="cp-new" placeholder="Minimum 6 characters"/></div>'

    +'<button class="btn ghost" onclick="closeMo()">Cancel</button>'

function submitChangePassword() {
  var old=val('cp-old'), nw=val('cp-new'), conf=val('cp-conf');
  if (!old||!nw) { toast('⚠ All fields required'); return; }
  if (nw.length < 6) { toast('⚠ New password must be at least 6 characters'); return; }
  if (nw !== conf) { toast('⚠ Passwords do not match'); return; }
  toast('⏳ Updating…'); closeMo();
  gsr().withSuccessHandler(function(r){
    if (!r||!r.ok) { toast('❌ '+(r?r.error:'failed')); return; }
    toast('✅ Password updated!');
  }).withFailureHandler(function(e){ toast('❌ '+(e?e.message:'')); })
  .changePassword(ME.username, old, nw);
}

}

// ─ Edit milestones modal ─
function cleanDate(v) {
  // Google Sheets may return "2025-01-15 00:00:00" or Date objects serialised with time — strip to YYYY-MM-DD
  if(!v) return '';
  var str = String(v).trim();
  // Already YYYY-MM-DD (10 chars)
  if(/^\d{4}-\d{2}-\d{2}$/.test(str)) return str;
  // Has time suffix — take first 10 chars
  if(str.length > 10 && str[4]==='-') return str.substring(0,10);
  return str;
}

// ═══ MILESTONE TICK ═══════════════════════════════════════════════
// doneVal: 0=Pending, 1=Submitted, 2=Approved
function tick(sid, mid, doneVal) {
  var dv = Number(doneVal);
  var by = meStr();
  toast('⏳ Saving…');
  gsr().withSuccessHandler(function(r){
    if(!r||!r.ok){ toast('❌ '+(r?r.error:'failed')); return; }
    // After save confirmed, pull fresh progress+students from the sheet
    // This ensures what we display matches exactly what's persisted
    gsr().withSuccessHandler(function(pr){
      if (pr && pr.ok) {
        D.progress = normaliseProgress(pr.progress || []);
        // Merge updated students back (only update Progress & Status fields to avoid stomping other in-memory changes)
        (pr.students || []).forEach(function(fresh){
          var local = D.students.find(function(x){ return s(x.ID)===s(fresh.ID); });
          if (local) { local.Progress=fresh.Progress; local.Status=fresh.Status; }
        });
        // Update the poll token so auto-poll doesn't trigger an unnecessary reload
        _lastToken = pr.token || _lastToken;
      } else {
        // Fallback: patch in-memory optimistically if getProgressOnly failed
        var found=false;
        D.progress.forEach(function(p){
          if(s(p.StudentID)===s(sid)&&s(p.MilestoneID)===s(mid)){
            p.Done=dv; p.Date=dv>0?new Date().toISOString().slice(0,10):''; p.UpdatedBy=by; found=true;
          }
        });
        if(!found) D.progress.push({StudentID:String(sid),MilestoneID:String(mid),Done:dv,Date:dv>0?new Date().toISOString().slice(0,10):'',UpdatedBy:by});
        var st=D.students.find(function(x){return s(x.ID)===s(sid);});
        if(st){
          var ms=cMs(st.CohortID);
          var points=ms.reduce(function(acc,m){ var pdv=getDoneVal(sid,m.ID); return acc+(pdv===2?1:pdv===1?0.5:0); },0);
          var pct=ms.length?Math.round(points/ms.length*100):0;
          st.Progress=pct; st.Status=pct>=100?'Completed':pct===0?'Delayed':pct<30?'At Risk':pct<50?'Delayed':'On Track';
        }
      }
      buildSidebar();
      renderSDetail(sid);
      // Re-render cohort detail if it's currently visible
      var cdetailTab=document.getElementById('tab-cdetail');
      var st2=D.students.find(function(x){return s(x.ID)===s(sid);});
      if(cdetailTab&&cdetailTab.classList.contains('on')&&st2){
        renderCDetail(st2.CohortID);
        document.querySelectorAll('.tab').forEach(function(el){el.classList.remove('on');});
        document.getElementById('tab-sdetail').classList.add('on');
      }
      // ── Always refresh the Timeline tab if it has been rendered ───
      // We can't rely on 'on' class because tick fires from student detail.
      // If timeline has content (panels exist), do a full re-render so the
      // milestone grid cells immediately reflect the new state.
      patchTimeline();
      var label=dv===2?'✓ Approved':dv===1?'⏳ Submitted':'Marked pending';
      toast('✅ '+label+'!');
    }).withFailureHandler(function(){ 
      // getProgressOnly failed — still re-render with optimistic data
      buildSidebar(); renderSDetail(sid);
      patchTimeline();
      toast('✅ '+(dv===2?'✓ Approved':dv===1?'⏳ Submitted':'Marked pending')+'!');
    })
    .getProgressOnly();
  }).withFailureHandler(function(e){ toast('❌ '+(e?e.message:'')); })
  .saveTick(sid, mid, dv, by);
}

function submitEditCohort(cid){
  var n=val('ec-name'),sem=val('ec-sem'),prog=val('ec-prog'),unit=val('ec-unit'),st=val('ec-start'),en=val('ec-end'),status=val('ec-status'),lv=val('ec-level')||'PG';
  if(!n||!sem){ toast('⚠ Name and semester required'); return; }
  toast('⏳ Saving…'); closeMo();
  gsr().withSuccessHandler(function(r){
    if(!r||!r.ok){ toast('❌ '+(r?r.error:'failed')); return; }
    var c=D.cohorts.find(function(x){return s(x.ID)===s(cid);});
    if(c){c.Name=n;c.Semester=sem;c.Programme=prog;c.Unit=unit;c.StartDate=st;c.EndDate=en;c.Status=status;c.Level=lv;}
    renderCohorts(); renderOverview(); buildSidebar(); toast('✅ Cohort updated!');
  }).withFailureHandler(function(e){ toast('❌ '+(e?e.message:'')); })
  .updateCohort(cid, n, sem, prog, unit, st, en, status, lv);
}
function delCohort(cid) {
  var c=D.cohorts.find(function(x){return s(x.ID)===s(cid);})||{};
  var sts=D.students.filter(function(x){return s(x.CohortID)===s(cid);});
  confirm2('🗑️','Delete Cohort "'+c.Name+'"',
    sts.length?'This cohort has '+sts.length+' student(s). All related data will be removed permanently.':'This cohort will be permanently deleted.',
    'Delete','danger',function(){
      toast('⏳ Deleting…');
      gsr().withSuccessHandler(function(r){
        if(!r||!r.ok){ toast('❌ '+(r?r.error:'failed')); return; }
        D.cohorts=D.cohorts.filter(function(x){return s(x.ID)!==s(cid);});
        renderCohorts(); renderOverview(); buildSidebar(); goTab('cohorts');
        toast('✅ Cohort deleted!');
      }).withFailureHandler(function(e){ toast('❌ '+(e?e.message:'')); })
      .deleteCohort(cid);
    }
  );
}

// ═══ COHORT REPORT ════════════════════════════════════════════════
function openCohortReport(cid) {
  var c   = D.cohorts.find(function(x){ return s(x.ID)===s(cid); }); if(!c) return;
  var sts = D.students.filter(function(x){ return s(x.CohortID)===s(cid); });
  var ms  = cMs(cid);
  var cl  = COLORS[D.cohorts.indexOf(c)%COLORS.length];
  var today = new Date().toISOString().slice(0,10);

  // Stats
  var onT=0,del=0,rsk=0,don=0;
  sts.forEach(function(x){
    if(x.Status==='On Track')onT++; else if(x.Status==='Delayed')del++;
    else if(x.Status==='At Risk')rsk++; else if(x.Status==='Completed')don++;
  });
  var av = avg_(sts);

  // Status badge HTML for report
  function statusBadge(st) {
    var clr = st==='On Track'?'#10b981':st==='Delayed'?'#f59e0b':st==='At Risk'?'#f43f5e':st==='Completed'?'#a78bfa':'#6b7a99';
    return '<span style="background:'+clr+'22;color:'+clr+';border:1px solid '+clr+'44;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:600">'+st+'</span>';
  }

  // Milestone completion per student
  var studentRows = sts.map(function(x) {
    var doneCount = ms.filter(function(m){ return isDone(x.ID,m.ID); }).length;
    var pct = +x.Progress;
    var msTicks = ms.map(function(m){
      return '<td style="text-align:center;font-size:12px;color:'+(isDone(x.ID,m.ID)?'#10b981':'#6b7a99')+'">'+(isDone(x.ID,m.ID)?'✓':'○')+'</td>';
    }).join('');
    return '<tr style="border-bottom:1px solid #e5e7eb">'
      +'<td style="padding:7px 10px;font-weight:600;font-size:12px">'+esc(x.Name)+'</td>'
      +'<td style="padding:7px 10px;font-size:11px;color:#6b7280">'+esc(x.RegNo)+'</td>'
      +'<td style="padding:7px 10px;font-size:11px;color:#6b7280">'+esc(supName(x.SupervisorID))+'</td>'
      +'<td style="padding:7px 10px;font-size:11px">'+esc(x.Programme||c.Programme||'—')+'</td>'
      +'<td style="padding:7px 10px;font-size:11px">'+esc(x.Specialisation||c.Unit||'—')+'</td>'
      +msTicks
      +'<td style="padding:7px 10px;text-align:center;font-weight:700;font-size:12px;color:'+(pct>=75?'#10b981':pct>=40?'#3b82f6':pct>=20?'#f59e0b':'#f43f5e')+'">'+pct+'%</td>'
      +'<td style="padding:7px 10px">'+statusBadge(x.Status)+'</td>'
      +'</tr>';
  }).join('');

  var msHeaders = ms.map(function(m){
    return '<th style="padding:7px 6px;font-size:10px;font-weight:700;text-align:center;color:#374151;border-bottom:2px solid #d1d5db;max-width:60px;white-space:normal;word-break:break-word" title="'+(m.WeekOffset?'Due: '+m.WeekOffset:'')+'">'
      +esc(m.Name||'')+(m.WeekOffset?'<br><span style="font-weight:400;color:#9ca3af">'+m.WeekOffset+'</span>':'')+'</th>';
  }).join('');

  // Milestone summary section
  var msSummary = ms.map(function(m) {
    var done = sts.filter(function(x){ return isDone(x.ID,m.ID); }).length;
    var pct  = sts.length ? Math.round(done/sts.length*100) : 0;
    var barColor = pct>=80?'#10b981':pct>=50?'#3b82f6':pct>=25?'#f59e0b':'#f43f5e';
    return '<tr style="border-bottom:1px solid #f3f4f6">'
      +'<td style="padding:8px 10px;font-weight:600;font-size:12px">'+esc(m.Name||'')+'</td>'
      +'<td style="padding:8px 10px;font-size:11px;color:#6b7280">'+(m.WeekOffset||'—')+'</td>'
      +'<td style="padding:8px 10px;font-size:12px;text-align:center">'+done+' / '+sts.length+'</td>'
      +'<td style="padding:8px 10px;min-width:120px">'
      +'<div style="background:#f3f4f6;border-radius:4px;height:8px;overflow:hidden">'
      +'<div style="width:'+pct+'%;height:100%;background:'+barColor+';border-radius:4px"></div></div></td>'
      +'<td style="padding:8px 10px;font-weight:700;font-size:12px;color:'+barColor+'">'+pct+'%</td>'
      +'</tr>';
  }).join('');

  // Build the full printable report HTML
  var reportHtml = '<!DOCTYPE html><html><head><meta charset="utf-8"/>'
    +'<title>'+esc(c.Name)+' — PG Track Report</title>'
    +'<style>'
    +'body{font-family:Arial,sans-serif;color:#111827;background:#fff;margin:0;padding:24px;font-size:13px}'
    +'h1{font-size:22px;font-weight:700;margin:0 0 4px}h2{font-size:15px;font-weight:700;margin:20px 0 8px;color:#1e40af}'
    +'table{width:100%;border-collapse:collapse;margin-bottom:20px}'
    +'th{background:#f8fafc;padding:8px 10px;text-align:left;font-size:11px;font-weight:700;color:#374151;border-bottom:2px solid #d1d5db}'
    +'.stat-box{display:inline-block;padding:10px 18px;border-radius:8px;margin:0 8px 8px 0;border:1px solid #e5e7eb}'
    +'@media print{body{padding:12px}button{display:none}}'
    +'</style></head><body>'

    // Header
    +'<div style="border-bottom:3px solid '+cl+';padding-bottom:16px;margin-bottom:20px">'
    +'<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px">'
    +'<div><h1>'+esc(c.Name)+'</h1>'
    +'<div style="color:#6b7280;font-size:13px;margin-top:4px">'+(c.Programme||'')+(c.Unit?' · '+c.Unit:'')+(c.Semester?' · '+c.Semester:'')+'</div>'
    +'<div style="color:#9ca3af;font-size:11px;margin-top:4px">Report generated: '+today+' · PG Track</div></div>'
    +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">'
    +'<button onclick="window.print()" style="padding:8px 16px;background:#1e40af;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer">🖨 Print / PDF</button>'
    +'<button onclick="exportCSV()" style="padding:8px 16px;background:#047857;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer">📄 Export CSV</button>'
    +'<button onclick="exportExcel()" style="padding:8px 16px;background:#1d4ed8;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer">📊 Export Excel</button>'
    +'</div></div></div>'

    // Summary stats
    +'<h2>Summary</h2>'
    +'<div style="margin-bottom:16px">'
    +'<div class="stat-box"><div style="font-size:24px;font-weight:700;color:'+cl+'">'+sts.length+'</div><div style="font-size:11px;color:#6b7280">Total Students</div></div>'
    +'<div class="stat-box"><div style="font-size:24px;font-weight:700;color:#10b981">'+onT+'</div><div style="font-size:11px;color:#6b7280">On Track</div></div>'
    +'<div class="stat-box"><div style="font-size:24px;font-weight:700;color:#f59e0b">'+del+'</div><div style="font-size:11px;color:#6b7280">Delayed</div></div>'
    +'<div class="stat-box"><div style="font-size:24px;font-weight:700;color:#f43f5e">'+rsk+'</div><div style="font-size:11px;color:#6b7280">At Risk</div></div>'
    +'<div class="stat-box"><div style="font-size:24px;font-weight:700;color:#a78bfa">'+don+'</div><div style="font-size:11px;color:#6b7280">Completed</div></div>'
    +'<div class="stat-box"><div style="font-size:24px;font-weight:700;color:'+cl+'">'+av+'%</div><div style="font-size:11px;color:#6b7280">Avg Progress</div></div>'
    +'</div>'
    +'<table><tr>'
    +'<th>Start Date</th><th>End Date</th><th>Milestones</th><th>Programme</th><th>Specialisation</th>'
    +'</tr><tr style="border-bottom:1px solid #e5e7eb">'
    +'<td style="padding:8px 10px">'+(c.StartDate||'—')+'</td>'
    +'<td style="padding:8px 10px">'+(c.EndDate||'—')+'</td>'
    +'<td style="padding:8px 10px">'+ms.length+'</td>'
    +'<td style="padding:8px 10px">'+(c.Programme||'—')+'</td>'
    +'<td style="padding:8px 10px">'+(c.Unit||'—')+'</td>'
    +'</tr></table>'

    // Milestone summary
    +'<h2>Milestone Completion Summary</h2>'
    +(ms.length ? '<table><thead><tr><th>Milestone</th><th>Target Date</th><th>Completed</th><th>Progress Bar</th><th>%</th></tr></thead><tbody>'+msSummary+'</tbody></table>'
      : '<p style="color:#9ca3af">No milestones defined.</p>')

    // Student table
    +'<h2>Student Progress Detail</h2>'
    +(sts.length ? '<div style="overflow-x:auto"><table><thead><tr>'
      +'<th>Name</th><th>Reg No</th><th>Supervisor</th><th>Programme</th><th>Specialisation</th>'
      +msHeaders
      +'<th style="text-align:center">Progress</th><th>Status</th>'
      +'</tr></thead><tbody>'+studentRows+'</tbody></table></div>'
      : '<p style="color:#9ca3af">No students in this cohort.</p>')

    +'</body></html>';

  // Inject export data as JSON into the report via the URL (data URI approach)
  // Build CSV rows here in the parent window where quoting is safe
  var csvHeader = ['Name','RegNo','Email','Mobile','Programme','Specialisation','Supervisor']
    .concat(ms.map(function(m){ return (m.Name||'')+(m.WeekOffset?' ('+m.WeekOffset+')':''); }))
    .concat(['Progress%','Status']);
  var csvData = [csvHeader].concat(sts.map(function(x){
    var ticks = ms.map(function(m){ return isDone(x.ID,m.ID)?'Done':'Pending'; });
    return [x.Name||'',x.RegNo||'',x.Email||'',x.Mobile||'',
            x.Programme||c.Programme||'',x.Specialisation||c.Unit||'',
            supName(x.SupervisorID)].concat(ticks).concat([x.Progress||0, x.Status||'']);
  }));

  function escCsv(v) {
    var sv = String(v == null ? '' : v);
    return (sv.indexOf(',') > -1 || sv.indexOf('\n') > -1 || sv.indexOf('"') > -1)
      ? '"' + sv.replace(/"/g, '""') + '"' : sv;
  }
  var csvString = csvData.map(function(r){ return r.map(escCsv).join(','); }).join('\n');
  var cohortSlug = (c.Name||'cohort').replace(/[^a-zA-Z0-9]/g,'_');

  // Build XLS table
  var xlsRows = csvData.map(function(r){
    return '<tr>'+r.map(function(cell){
      return '<td>'+String(cell==null?'':cell).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</td>';
    }).join('')+'</tr>';
  }).join('');

  // Inject everything into the report window via a script tag with encoded data
  var exportScript = '<script>'
    + 'var _csv=' + JSON.stringify(csvString) + ';'
    + 'var _slug=' + JSON.stringify(cohortSlug) + ';'
    + 'var _xlsRows=' + JSON.stringify(xlsRows) + ';'
    + 'function exportCSV(){'
    +   'var b=new Blob(["\\uFEFF"+_csv],{type:"text/csv;charset=utf-8"});'
    +   'var a=document.createElement("a");a.href=URL.createObjectURL(b);'
    +   'a.download=_slug+"_report.csv";a.click();}'
    + 'function exportExcel(){'
    +   'var xls="<html xmlns:o=\'urn:schemas-microsoft-com:office:office\' xmlns:x=\'urn:schemas-microsoft-com:office:excel\'><head><meta charset=\'utf-8\'></head><body><table>"+_xlsRows+"</table></body></html>";'
    +   'var b=new Blob(["\\uFEFF"+xls],{type:"application/vnd.ms-excel;charset=utf-8"});'
    +   'var a=document.createElement("a");a.href=URL.createObjectURL(b);'
    +   'a.download=_slug+"_report.xls";a.click();}'
    + '<\/script>';

  reportHtml = reportHtml.replace('</body>', exportScript + '</body>');

  // Open in new window
  var win = window.open('', '_blank');
  if (win) {
    win.document.write(reportHtml);
    win.document.close();
  } else {
    toast('⚠ Pop-up blocked. Allow pop-ups for this site to view reports.');
  }
}

    +'<button class="btn ghost" onclick="closeMo()">Cancel</button>'

}

        +'</tr>';

function parseCSV(raw){ return raw.trim().split('\n').map(function(l){ l=l.trim(); if(!l)return null; return l.includes('\t')?l.split('\t'):l.split(','); }).filter(Boolean); }
function submitBulk(cid){
  var raw=val('bcsv'), sup=val('bsup'), defaultSpec=val('bspec');
  if(!raw.trim()){ toast('⚠ Paste student data first'); return; }
  var rows=parseCSV(raw).map(function(r){
    return {
      name:          (r[0]||'').trim(),
      regNo:         (r[1]||'').trim(),
      email:         (r[2]||'').trim(),
      title:         (r[3]||'').trim(),
      mobile:        (r[4]||'').trim(),
      programme:     (r[5]||'').trim(),
      specialisation:(r[6]||defaultSpec||'').trim(),
      supervisorId:  sup
    };
  });
  var invalid=rows.filter(function(r){return !r.name||!r.regNo;});
  if(invalid.length){ toast('⚠ '+invalid.length+' row(s) missing Name or RegNo'); return; }
  toast('⏳ Importing '+rows.length+' student(s) into cohort…'); closeMo();
  gsr().withSuccessHandler(function(r){
    if(!r||!r.ok){ toast('❌ '+(r?r.error:'failed')); return; }
    var msg='✅ Imported '+r.added+' student(s)';
    if(r.skipped&&r.skipped>0) msg+=' · ⚠ '+r.skipped+' duplicate(s) skipped';
    if(r.errors&&r.errors.length) msg+=' · ❌ '+r.errors.length+' error(s)';
    toast(msg, r.skipped>0||r.errors&&r.errors.length?'warn':'success');
    silentReload();
  }).withFailureHandler(function(e){ toast('❌ '+(e?e.message:'')); })
  .bulkAdd(cid, rows);
}

// ═══ MANUAL STATUS OVERRIDE ═══════════════════════════════════════
// ── Individual student reminder ──────────────────────────────────
function openStudentReminder(sid, studentName) {
  var x   = D.students.find(function(v){ return s(v.ID)===s(sid); }); if(!x) return;
  var ms  = cMs(x.CohortID);
  var pending = ms.filter(function(m){ return !isDone(sid, m.ID); });

  if (!pending.length) {
    toast('✅ '+studentName+' has completed all milestones!');
    return;
  }

  var rows = pending.map(function(m) {
    var dateLabel = m.WeekOffset ? ' · Due: '+m.WeekOffset : ' · No date set';
    return '<div class="dl-row">'
      +'<div style="flex:1">'
      +'<div class="xs bold">'+esc(m.Name||'')+'</div>'
      +'<div class="xs muted">'+esc(dateLabel)+'</div>'
      +'</div>'
      +'<button class="btn ghost xs" onclick="sendOneStudentReminder(\''+sid+'\',\''+m.ID+'\',\''+esc(m.Name||'')+'\')">📧 Send</button>'
      +'</div>';
  }).join('');

  openMo('📧 Remind — '+studentName, false,
    '<div class="gc sm mb12" style="background:rgba(79,142,247,.07);border-color:rgba(79,142,247,.2)">'
    +'<div class="xs muted">'+pending.length+' pending milestone(s). Send individual reminders or all at once.</div>'
    +'</div>'
    +'<div style="max-height:280px;overflow-y:auto;margin-bottom:12px">'+rows+'</div>'
    +'<div class="flex gap8" style="justify-content:flex-end">'
    +'<button class="btn ghost" onclick="closeMo()">Cancel</button>'
    +'<button class="btn prim" onclick="sendAllStudentReminders(\''+sid+'\',\''+esc(studentName)+'\','+pending.length+')">📧 Send All ('+pending.length+')</button>'
    +'</div>'
  );
}

function sendOneStudentReminder(sid, mid, milestoneName) {
  toast('⏳ Sending…');
  gsr().withSuccessHandler(function(r){
    if(!r||!r.ok){ toast('❌ '+(r?r.error:'failed')); return; }
    toast('✅ Reminder sent for: '+milestoneName);
  }).withFailureHandler(function(e){ toast('❌ '+(e?e.message:'')); })
  .sendReminderToStudent(sid, mid, false);
}

function sendAllStudentReminders(sid, studentName, count) {
  confirm2('📧','Send All Reminders','Send '+count+' reminder(s) to '+studentName+' for all pending milestones?',
    'Send All','prim', function(){
      toast('⏳ Sending…'); closeMo();
      // Send for each pending milestone
      var x  = D.students.find(function(v){ return s(v.ID)===s(sid); }); if(!x) return;
      var ms = cMs(x.CohortID).filter(function(m){ return !isDone(sid, m.ID); });
      var pending = ms.length, done = 0, errs = 0;
      if (!pending) { toast('Nothing to send'); return; }
      ms.forEach(function(m){
        gsr().withSuccessHandler(function(r){
          done++;
          if(!r||!r.ok) errs++;
          if(done===pending) toast(errs ? '⚠ Sent '+(done-errs)+', '+errs+' failed' : '✅ Sent '+done+' reminder(s) to '+studentName);
        }).withFailureHandler(function(){ errs++; done++; })
        .sendReminderToStudent(sid, m.ID, false);
      });
    });
}

function openStatusOverride(sid, currentStatus, currentPct) {
  var x = D.students.find(function(v){ return s(v.ID)===s(sid); }); if(!x) return;
  var statuses = ['On Track','Delayed','At Risk','Completed'];
  var statusOpts = statuses.map(function(st){
    return '<option value="'+st+'"'+(st===currentStatus?' selected':'')+'>'+st+'</option>';
  }).join('');
  openMo('⚙ Override Status — '+x.Name, false,
    '<div class="gc sm mb12" style="background:rgba(245,158,11,.06);border-color:rgba(245,158,11,.2)">'
    +'<div class="xs" style="color:#fbbf24">⚠ This manually overrides the auto-calculated status. The milestone checkboxes will still reflect actual progress.</div></div>'
    +'<div class="fg"><label class="lbl">Status</label>'
    +'<select class="sel" id="so-status">'+statusOpts+'</select></div>'
    +'<div class="fg"><label class="lbl">Progress % <span style="font-weight:400;text-transform:none">(leave blank to keep current: '+currentPct+'%)</span></label>'
    +'<input class="inp" type="number" id="so-pct" min="0" max="100" placeholder="0–100 (optional)"/></div>'
    +'<div class="flex gap8" style="justify-content:flex-end;margin-top:8px">'
    +'<button class="btn ghost" onclick="closeMo()">Cancel</button>'
    +'<button class="btn prim" onclick="submitStatusOverride(\''+sid+'\')">Save Override</button></div>'
  );
}
function submitStatusOverride(sid) {
  var status = val('so-status');
  var pctRaw = val('so-pct').trim();
  var pct    = pctRaw === '' ? null : Math.min(100, Math.max(0, Number(pctRaw)));
  if (!status) { toast('⚠ Select a status'); return; }
  toast('⏳ Saving…'); closeMo();
  gsr().withSuccessHandler(function(r){
    if(!r||!r.ok){ toast('❌ '+(r?r.error:'failed')); return; }
    // Update local data immediately
    var x = D.students.find(function(v){ return s(v.ID)===s(sid); });
    if (x) {
      x.Status = status;
      if (pct !== null) x.Progress = pct;
    }
    renderSDetail(sid); renderStudents(); buildSidebar();
    toast('✅ Status updated!');
  }).withFailureHandler(function(e){ toast('❌ '+(e?e.message:'')); })
  .updateStudentStatus(sid, status, pct);
}

// ═══ 1-ON-1 SESSIONS ══════════════════════════════════════════════
function openSessionRecord(sid, mid, milestoneName) {
  var existing = D.sessions.filter(function(ss){ return s(ss.StudentID)===s(sid) && s(ss.MilestoneID)===s(mid); });
  var histHTML = '';
  if (existing.length) {
    histHTML = '<div class="st" style="font-size:11px;margin-bottom:6px">Previous Sessions</div>'
      + existing.map(function(ss) {
          var statusColor = +ss.Attended===1?'#10b981':+ss.Attended===3?'#3b82f6':+ss.Attended===2?'#f59e0b':'#f43f5e';
          var statusLabel = +ss.Attended===1?'✓ Attended':+ss.Attended===3?'📆 Booked':+ss.Attended===2?'↺ Rescheduled':'✗ Absent';
          return '<div class="dl-row" style="padding:7px 0">'
            +'<div style="flex:1">'
            +'<div class="xs bold">'+esc(ss.SessionDate||'—')+'</div>'
            +'<div class="xs muted">'+esc(ss.Notes||'—')+'</div>'
            +'<div class="xs muted">Recorded by: '+esc(ss.RecordedBy||'—')+'</div>'
            +'</div>'
            +'<span class="xs bold" style="color:'+statusColor+'">'+statusLabel+'</span>'
            +'<button class="btn danger xs" onclick="deleteSessionRecord(\''+ss.ID+'\',\''+sid+'\',\''+mid+'\')">🗑</button>'
            +'</div>';
        }).join('');
  }

  openMo('📅 1-on-1 Session — '+milestoneName, false,
    (histHTML ? '<div class="gc sm mb12" style="max-height:160px;overflow-y:auto">'+histHTML+'</div>' : '')
    +'<div class="st" style="font-size:11px;margin-bottom:8px">Record New Session</div>'
    +'<div class="frow mb8">'
    +'<div class="fg"><label class="lbl">Session Date</label><input class="inp" type="date" id="ss-date" value="'+new Date().toISOString().slice(0,10)+'"/></div>'
    +'<div class="fg"><label class="lbl">Attendance</label>'
    +'<select class="sel" id="ss-att">'
    +'<option value="3">📆 Appointment Booked</option>'
    +'<option value="1">✓ Attended</option>'
    +'<option value="0">✗ Absent</option>'
    +'<option value="2">↺ Rescheduled</option>'
    +'</select></div></div>'
    +'<div class="fg mb12"><label class="lbl">Notes <span style="font-weight:400;text-transform:none">(optional)</span></label>'
    +'<textarea class="csv-ta" id="ss-notes" rows="3" placeholder="Discussion points, next steps, concerns…"></textarea></div>'
    +'<div class="flex gap8" style="justify-content:flex-end">'
    +'<button class="btn ghost" onclick="closeMo()">Cancel</button>'
    +'<button class="btn prim" onclick="submitSession(\''+sid+'\',\''+mid+'\')">Save Session</button>'
    +'</div>'
  );
}

function submitSession(sid, mid) {
  var date    = val('ss-date');
  var att     = val('ss-att');
  var notes   = (document.getElementById('ss-notes')||{}).value || '';
  var by      = meStr();
  if (!date) { toast('⚠ Session date is required'); return; }
  toast('⏳ Saving…'); closeMo();
  gsr().withSuccessHandler(function(r){
    if (!r||!r.ok) { toast('❌ '+(r?r.error:'failed')); return; }
    // Update local sessions data
    D.sessions.push({ ID: r.id||Date.now(), StudentID: sid, MilestoneID: mid,
      SessionDate: date, Attended: +att, Notes: notes, RecordedBy: by });
    renderSDetail(sid);
    toast('✅ Session recorded!');
  }).withFailureHandler(function(e){ toast('❌ '+(e?e.message:'')); })
  .saveSession(null, sid, mid, date, +att, notes, by);
}

function deleteSessionRecord(ssId, sid, mid) {
  confirm2('🗑️','Delete Session','Remove this session record permanently?','Delete','danger',function(){
    toast('⏳ Deleting…');
    gsr().withSuccessHandler(function(r){
      if (!r||!r.ok) { toast('❌ '+(r?r.error:'failed')); return; }
      D.sessions = D.sessions.filter(function(ss){ return s(ss.ID)!==s(ssId); });
      renderSDetail(sid);
      toast('✅ Session deleted');
    }).withFailureHandler(function(e){ toast('❌ '+(e?e.message:'')); })
    .deleteSession(ssId);
  });
}

// ═══ UTILS ════════════════════════════════════════════════════════
function set(id,html){ document.getElementById(id).innerHTML=html; }
function val(id){ var el=document.getElementById(id); return el?el.value:''; }
function esc(v){ return String(v||'').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function openMo(title,large,body){
  document.getElementById('mo-title').textContent=title;
  document.getElementById('mo-body').innerHTML=body;
  document.getElementById('mb').className='mb'+(large?' lg':'');
  document.getElementById('mo').classList.add('open');
}
function closeMo(){ document.getElementById('mo').classList.remove('open'); }

// ── Modern Toast Notifications ─────────────────────────────────────
function toast(msg, type) {
  type = type || 'info';
  // auto-detect type from prefix
  if (msg.startsWith('✅')) type = 'success';
  else if (msg.startsWith('❌')) type = 'error';
  else if (msg.startsWith('⚠')) type = 'warn';
  else if (msg.startsWith('⏳')) type = 'loading';

  var icons = {success:'✅',error:'❌',warn:'⚠️',loading:'⏳',info:'ℹ️'};
  var cleanMsg = msg.replace(/^[✅❌⚠️⏳ℹ️]\s*/,'');

  var id = 'toast-' + Date.now();
  var el = document.createElement('div');
  el.className = 'toast-item ' + type;
  el.id = id;
  el.innerHTML = '<span class="toast-icon">'+icons[type]+'</span>'
    +'<span class="toast-text">'+cleanMsg+'</span>'
    +'<button class="toast-close" onclick="dismissToast(\''+id+'\')">✕</button>';

  var container = document.getElementById('toast-container');
  container.appendChild(el);

  var dur = type === 'loading' ? 8000 : type === 'error' ? 5000 : 3000;
  setTimeout(function(){ dismissToast(id); }, dur);
  return id;
}
function dismissToast(id) {
  var el = document.getElementById(id);
  if (!el) return;
  el.classList.add('out');
  setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, 320);
}

// ── Modern Confirm Dialog ──────────────────────────────────────────
function confirm2(icon, title, msg, confirmLabel, confirmClass, onYes) {
  document.getElementById('confirm-icon').textContent = icon;
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').textContent = msg;
  document.getElementById('confirm-actions').innerHTML =
    '<button class="btn ghost" onclick="closeConfirm()">Cancel</button>'
    +'<button class="btn '+confirmClass+'" onclick="closeConfirm();('+onYes+')()">'+confirmLabel+'</button>';
  document.getElementById('confirm-overlay').classList.add('open');
}
function closeConfirm(){ document.getElementById('confirm-overlay').classList.remove('open'); }
